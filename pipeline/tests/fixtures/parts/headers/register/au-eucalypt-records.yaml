faq:
- q: Whose records are these?
  a: Every row comes from a government herbarium or flora atlas, read through the Atlas of Living
    Australia, which is the national biodiversity database funded by the Australian Government and
    hosted by CSIRO. The providers are the state and territory herbaria and atlases, the national
    herbarium at CSIRO, the Australian National Botanic Gardens and the state botanic gardens. The
    provider is named in every row. Records from citizen science apps, universities and overseas
    collections are not included.
- q: What is a record?
  a: A specimen held in a herbarium, or an observation logged in a flora atlas, of a plant in the
    genera Eucalyptus, Corymbia and Angophora, which together are the eucalypts. The basis of record
    field says which. A specimen row names the collection and its catalogue number.
- q: Why do some dates look wrong?
  a: The dates are the providers' own. Some 1,500 rows carry the year 1599 and about one row in fifteen
    has no year at all, and they are kept as published. The oldest plausible records are from 1770.
- q: How exact are the coordinates?
  a: Each row carries the coordinates the provider gave and, where known, the uncertainty in
    metres. Old specimens are often placed to the nearest ten kilometres. The Atlas also generalises
    the coordinates of some threatened species at the provider's request.
- q: What licence applies?
  a: Only rows the provider released under CC0 or a CC BY licence are included, and the licence is
    in every row. When you use the data, name the provider in the row as well as the Atlas.
summary: Every eucalypt record held by Australia's government herbaria and flora atlases, one row
  per specimen or observation, with its species, date, coordinates, provider and licence, read
  through the Atlas of Living Australia.
description: One row per record of a eucalypt (the genera Eucalyptus, Corymbia and Angophora) from
  a state, territory or Commonwealth herbarium or flora atlas, as the Atlas of Living Australia
  holds it. Each row carries the record identifier, the species, the date and year, the state, the
  coordinates and their uncertainty, whether the record is a specimen or an observation, the
  collection and catalogue number for a specimen, the provider and the licence the provider
  chose.

  The Atlas of Living Australia aggregates records from many sources. This dataset takes only the
  government providers named below, under open licences, so a row here is an official record.
