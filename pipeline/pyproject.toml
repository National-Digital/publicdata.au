[project]
name = "publicdata"
version = "0.1.0"
description = "Builds publicdata.au: versioned, schema-carrying serialisations of open government data."
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"
dependencies = [
  "pyarrow>=25.0.1",
  "pyyaml>=6.0.3",
  "requests>=2.34.2",
  "jinja2>=3.1.6",
  "zstandard>=0.25.0",
  "xlsxwriter>=3.2.9",
  "openpyxl>=3.1.5",
  "pillow>=12.3.0",
  "duckdb>=1.5.6",
  "pmtiles>=3.8.1",
  "xlrd>=2.0.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1", "pytest-xdist>=3.8", "ruff==0.16.10"]
deploy = ["boto3>=1.43.106"]
hubs = ["huggingface_hub>=2.0.0", "kaggle>=2.2.4"]

[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["publicdata*"]

[tool.setuptools.package-data]
publicdata = ["templates/*", "static/*", "static/fonts/*", "schemaorg.json", "api.json", "au_states.json", "spatial-extension.json"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # A type-checking change will enable these with real annotations.
  "ANN",
  # These two fight ruff format, which owns trailing commas and joined strings.
  "COM812",
  "ISC001",
  # No file carries a copyright header; LICENSE covers the code.
  "CPY",
  # ruff format owns line length.
  "E501",
  # Outside the client's public API a docstring is optional and holds a why, as CONTRIBUTING.md
  # says; a forced one would be filler.
  "D1",
  # Counts of branches, returns, statements and arguments. A build step reads top to bottom in
  # one function, and splitting it to meet a count scatters it; review judges length.
  "C901",
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  # Exceptions are named for what happened (Refused, LicenceDrift), some are signals rather than
  # errors (d1's _Skip and _Defer), and the names appear in logs.
  "N818",
  # Every subprocess call passes an argument list with no shell, and its arguments come from the
  # repository and the register; S603 flags each call whatever it runs. git and npx are found on
  # PATH, as CI installs them.
  "S603",
  "S607",
]

[tool.ruff.lint.pydocstyle]
# The docstrings open with their summary on the first line and often describe what a function
# gives back ("The versions whose manifest is tracked"), which Google's convention allows and
# PEP 257's imperative mood would rewrite.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# pytest asserts with assert, and an expected value reads more plainly as a literal. A stand-in
# takes the signature of what it replaces, a fixture can be asked for only for its effect, and a
# test may call the private helper it tests.
"tests/**" = ["S101", "PLR2004", "ARG", "SLF001"]
# The fake S3 client takes boto3's keyword names.
"tests/test_r2.py" = ["N803"]
# The command line, the commands it hands to (gate.main, cost.run, verify.run) and the modules run
# with python -m report to the terminal.
"publicdata/{__main__,cost,dbcheck,gate,smithery,tdqs,verify}.py" = ["T201"]
# SQL is built from table and column names the register declares, quoted, with each value bound
# as a parameter or written by a literal helper. These modules write the DuckDB, SQLite and D1
# statements, and their tests read them back.
"publicdata/{d1,database,figures,records,site,spine}.py" = ["S608"]
"publicdata/serialise/{__init__,geo,profile}.py" = ["S608"]
"publicdata/serialise/writers/{gpkg,pmtiles,sqlite}.py" = ["S608"]
"tests/test_{d1,directory,profile,records}.py" = ["S608"]
# cost reads a publisher URL only once _sized has checked it is http or https, and otherwise
# reads the site and GitHub's API.
"publicdata/cost.py" = ["S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: left out of the pre-push run; tests/conftest.py decides which tests carry it"]
