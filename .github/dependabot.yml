version: 2
# One pull request per ecosystem a month, each reviewed by a maintainer as one change.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /pipeline
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      pipeline:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /clients/python
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      client:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
    groups:
      npm:
        patterns: ["*"]
