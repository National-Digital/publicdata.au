name: CodeQL

# Static analysis of the pipeline, the Pages Functions and the workflows, on pushes to main, pull
# requests and weekly. Code scanning needs a public repository, so the job skips green while private.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-24.04
    if: github.event.repository.visibility == 'public'
    permissions:
      security-events: write # uploads the scan's results to code scanning
      contents: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v3
        with:
          category: "/language:${{ matrix.language }}"
