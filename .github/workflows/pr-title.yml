name: PR title

# On a squash merge the PR title becomes the commit subject on main, so it must be a
# Conventional Commit. `edited` re-runs the check when the title is fixed, and `synchronize`
# reports it on each new head, which a required check needs.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  lint-title:
    name: Check title
    runs-on: ubuntu-24.04
    steps:
      - name: Verify Conventional Commit title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          types='feat|fix|docs|chore|perf|refactor|test|build|ci|style|revert|data'
          pattern="^($types)(\([a-z0-9./-]+\))?(!)?: .+"
          printf 'PR title: %s\n' "$TITLE"
          if printf '%s' "$TITLE" | grep -qE "$pattern"; then
            echo "ok"
          else
            echo "::error::PR title is not a Conventional Commit. Use '<type>[optional scope]: <subject>'. Allowed types: ${types//|/, }. See CONTRIBUTING.md."
            exit 1
          fi
