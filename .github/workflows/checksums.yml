name: Checksums

# Writes any missing SHA256SUMS across every dataset in R2, hashing a file stored without its
# SHA-256, and signs every current list again. Run it once after the lists first ship, and after
# a deploy warns that a list went unwritten or unsigned. A list signed twice verifies either way.
on:
  workflow_dispatch:

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/pipeline/requirements.txt

permissions:
  contents: read

concurrency:
  group: checksums
  cancel-in-progress: false

jobs:
  write:
    name: write
    # Side effects run only in the public repo, never in a fork or a private copy.
    if: github.repository == 'National-Digital/publicdata.au'
    runs-on: ubuntu-24.04
    environment: production
    outputs:
      parts: ${{ steps.lists.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - run: pip install -e './pipeline[deploy]'
      - name: Write and list every SHA256SUMS
        id: lists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python -m publicdata checksums --all --download --resign --subjects lists
          echo "parts=$(find lists -name '*.sha256' -printf '%f\n' | sed 's/\.sha256$//' | sort -n | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lists
          path: lists/
          retention-days: 1

  # An attestation takes at most 1,024 subjects, so each part of the listing is signed on its own.
  sign:
    name: sign ${{ matrix.part }}
    needs: write
    if: needs.write.outputs.parts != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the OIDC token Sigstore certifies to sign the attestation
      attestations: write # stores the attestation with the repository
    strategy:
      matrix:
        part: ${{ fromJSON(needs.write.outputs.parts) }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lists
          path: lists
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: lists/${{ matrix.part }}.sha256
