name: Fetch

# Reads every live dataset's portal, stores a new version when the bytes changed, pushes the raw
# bytes to R2 and opens one pull request per government with its new manifests, so a source that
# fails its checks holds back only its own government's. Each PR merges itself once data-pr.yml
# has approved it as the fetch's own and the checks are green; nothing is published before then.
# The portals' dataset lists are harvested by catalogue.yml.
on:
  # zizmor: ignore[concurrency-limits] the one fetch runner serialises fetches, and a group would replace a pending one
  schedule:
    - cron: "17 19 * * 1" # Tuesday 05:17 Brisbane
    # Live feeds (source.feed) every other day of the week, so each day a feed changes is a version.
    - cron: "47 19 * * 0,2-6" # 05:47 Brisbane
  workflow_dispatch:

env:
  UV_CONSTRAINT: ${{ github.workspace }}/pipeline/requirements.txt
  UV_BUILD_CONSTRAINT: ${{ github.workspace }}/pipeline/requirements.txt

# The fetch app's token pushes the branches and opens the pull requests.
permissions:
  contents: read

jobs:
  fetch:
    name: fetch
    permissions:
      contents: read
      issues: write # keeps the manual downloads issue current
    # Side effects run only in the public repo, never in a fork or a private copy.
    if: github.repository == 'National-Digital/publicdata.au'
    # Some portals, Queensland's among them, turn away cloud runners, so the fetch runs from an
    # Australian host. Its runner group admits this workflow on main and nothing else.
    runs-on: [self-hosted, publicdata-fetch] # zizmor: ignore[self-hosted-runner] some portals turn cloud runners away
    environment: fetch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Pushes go as the fetch app; the checkout's own credential would be sent alongside it.
          persist-credentials: false
      - name: Install gh
        env:
          GH_VERSION: 2.101.0
          GH_SHA256: 9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8
        run: |
          f="$RUNNER_TEMP/gh.tar.gz"
          curl -fsSL -o "$f" "https://github.com/cli/cli/releases/download/v${GH_VERSION}/gh_${GH_VERSION}_linux_amd64.tar.gz"
          echo "$GH_SHA256  $f" | sha256sum -c -
          tar xzf "$f" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gh_${GH_VERSION}_linux_amd64/bin" >> "$GITHUB_PATH"
      # setup-python has no builds for the host's Debian; uv's standalone Python runs anywhere.
      - id: py
        run: echo "version=$(cat .python-version)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ steps.py.outputs.version }}
          activate-environment: true
      - run: uv pip install -e './pipeline[deploy]'
      - name: Fetch
        id: run
        env:
          FEEDS: ${{ github.event.schedule == '47 19 * * 0,2-6' && '--feeds' || '' }}
        run: |
          set -o pipefail
          python -m publicdata fetch --store store --groups groups.json ${FEEDS:+"$FEEDS"} | tee fetch.log
      - name: Count new versions
        id: fetch
        run: |
          echo "changed=$(grep -cE ': new version [0-9]{4}-' fetch.log || true)" >> "$GITHUB_OUTPUT"
      - name: Push raw bytes to R2
        if: steps.fetch.outputs.changed != '0'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m publicdata store push
      # The fetch app's own identity opens the PR: only the app may push data/ branches, and data-pr.yml
      # approves only PRs it opened. Minted here because a token lasts an hour and a run can last longer.
      - name: Act as the fetch app
        id: app
        if: steps.fetch.outputs.changed != '0'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.FETCH_APP_CLIENT_ID }}
          private-key: ${{ secrets.FETCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open a pull request per government
        if: steps.fetch.outputs.changed != '0'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          # Pushes go as the app too, in place of the checkout's own credential.
          git config --local --replace-all http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          DATE=$(date -u +%Y-%m-%d)
          git config user.name "publicdata fetch"
          git config user.email "fetch@publicdata.au"
          # A fetch runs for an hour or more and main moves under it. A branch cut from the commit
          # checked out at the start is refused when main has since changed a workflow file, so the
          # branches are cut from main as it stands now; the manifests are untracked and carry over.
          git fetch -q origin main
          base=$(git rev-parse origin/main)
          groups() { python -c "import json,sys; g=json.load(open('groups.json')); print('\n'.join(g[sys.argv[1]] if len(sys.argv)>1 else sorted(g)))" "$@"; }
          failed=""
          jurs=$(groups)
          for jur in $jurs; do
            mapfile -t files < <(groups "$jur")
            slugs=$(for f in "${files[@]}"; do basename "$(dirname "$(dirname "$f")")"; done | paste -sd'|')
            lines=$(grep -E "^($slugs): new version [0-9]{4}-" fetch.log || true)
            # One government's failure is reported and the others still get their pull requests.
            # The other governments' manifests stay untracked in the tree while each branch is cut.
            # A failed command inside an if condition does not stop a set -e shell, so each step is chained.
            # shellcheck disable=SC2016 # the backticks are a Markdown fence
            if ! {
              git checkout -q --detach "$base" &&
              git checkout -q -b "data/fetch-$DATE-$jur-$GITHUB_RUN_ID" &&
              git add "${files[@]}" &&
              git commit -q -s -m "data($jur): new source versions fetched $DATE" -m "$lines" &&
              git push -q -u origin HEAD &&
              gh pr create --title "data($jur): new source versions fetched $DATE" --body "$(printf 'The fetch found changed source files for %s.\n\n```\n%s\n```\n\nRaw bytes are in R2 under publicdata-raw. Merging publishes the new versions.' "$jur" "$lines")" &&
              { gh pr merge --auto --squash || echo "::warning::auto-merge was not armed for $jur; merge its PR by hand."; }
            }; then
              failed="$failed $jur"
              # A branch pushed without its PR is removed, so the next run starts clean.
              git push -q origin --delete "data/fetch-$DATE-$jur-$GITHUB_RUN_ID" 2>/dev/null || true
              echo "No pull request was opened for $jur; its versions are fetched again next run." >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          [ -z "$failed" ] || { echo "::error::no pull request for:$failed"; exit 1; }
      # A manual source's host turns automated clients away, so a changed file waits in one open
      # issue for a person to download it (CONTRIBUTING.md, "Manual sources").
      - name: Keep the manual downloads issue current
        # The daily feeds run reads no manual source, so only a full run may close the issue.
        if: always() && steps.run.outcome == 'success' && github.event.schedule != '47 19 * * 0,2-6'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Manual downloads due
        run: |
          open=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')
          # shellcheck disable=SC2016 # the backticks are Markdown code spans
          due=$(grep -E ': MANUAL ' fetch.log | sed -E 's/^([^:]+): MANUAL [^:]+: download (\S+) .*/- [ ] `\1` from <\2>/' || true)
          if [ -z "$due" ]; then
            [ -z "$open" ] || gh issue close "$open" --comment "Nothing is due as of run $GITHUB_RUN_ID."
            exit 0
          fi
          body=$(printf 'The publisher changed these files and their hosts turn automated clients away. Download each in a browser and follow CONTRIBUTING.md, "Manual sources".\n\n%s\n\nRun %s.' "$due" "$GITHUB_RUN_ID")
          printf '%s\n' "$body" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$open" ]; then gh issue edit "$open" --body "$body"; else gh issue create --title "$TITLE" --body "$body"; fi
      - name: Fail when anything could not be fetched
        if: always()
        env:
          FETCH: ${{ steps.run.outcome }}
        run: |
          if [ "$FETCH" != "success" ] || grep -E ': FAILED' fetch.log; then
            echo "Some sources could not be fetched; see the lines above." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
