name: Contribute

# Keeps one issue labelled `good first issue` and `dataset` open for each of the most-wanted
# datasets: the register's backlog entries with an open licence and the catalogue records with
# enough votes (CONTRIBUTING.md, "Pick up a dataset task"). It reads the register here and the
# votes and catalogue records from the site's public API. The vote threshold and the cap on open
# issues are the repository variables CONTRIBUTE_VOTES and CONTRIBUTE_CAP.
on:
  schedule:
    - cron: "23 21 * * *" # 07:23 Brisbane
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print the issues the run would open, update and close, and change none
        type: boolean
        default: true

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/pipeline/requirements.txt

permissions:
  contents: read

concurrency:
  group: contribute
  cancel-in-progress: false

jobs:
  sync:
    name: sync
    # Side effects run only in the public repo, never in a fork or a private copy.
    if: github.repository == 'National-Digital/publicdata.au'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write # opens, updates and closes the dataset issues
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: pip install -e ./pipeline
      - name: Sync the dataset issues
        env:
          GH_TOKEN: ${{ github.token }}
          VOTES: ${{ vars.CONTRIBUTE_VOTES }}
          CAP: ${{ vars.CONTRIBUTE_CAP }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        run: |
          set -o pipefail
          # DRY_RUN is one flag or nothing, so it is left unquoted.
          # shellcheck disable=SC2086
          python -m publicdata contribute sync ${VOTES:+--votes "$VOTES"} ${CAP:+--cap "$CAP"} $DRY_RUN | tee contribute.log
          # Only the action lines: a dry run's issue bodies hold fences of their own.
          { echo '```'; grep '^contribute: ' contribute.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
