name: Deploy

# Builds dist/ from the committed register and raw store, proves the gate, pushes every dated
# version's files to R2, and deploys the pages to Cloudflare Pages. Pull requests get a preview,
# which keeps small version files on Pages because previews never write to R2.
# Without the Cloudflare secrets the job builds and gates from fixtures and stops there, green.
# The release number comes from the last v-tag and the PR title (scripts/next-version.mjs), and a
# production deploy tags it, cuts a GitHub release and updates the MCP Registry entry if it changed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      replace:
        description: Key prefixes whose existing R2 files this build may overwrite, space separated, e.g. d/<slug>/v/<date>/ (the version notes come from the PR that made the fix)
        type: string
        default: ""
      d1_budget:
        description: Rows written the D1 load may plan in this deploy, for an approved large load (empty keeps the default of 10 million)
        type: string
        default: ""
      d1_retry:
        description: Dataset slugs, space separated, or all, whose versions D1 skips after repeated failures and should try again
        type: string
        default: ""

# A new push to a pull request cancels its running preview, which writes nothing to R2. Main and
# dispatched runs always finish, because a production deploy cut short leaves R2 half written.
env:
  PIP_CONSTRAINT: ${{ github.workspace }}/pipeline/requirements.txt

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # A runner's disk cannot hold a build of every version at once, so the versions the build cache
  # cannot serve are spread over shard jobs by source bytes. The deploy job then builds the site
  # from the cache they filled. A replace dispatch rebuilds every version, so every dataset is
  # planned.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    # Side effects run only in the public repo, never in a fork or a private copy.
    if: ${{ github.repository == 'National-Digital/publicdata.au' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN_ID != '' }}
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      verify: ${{ steps.verify.outputs.slugs }}
      spatial: ${{ steps.spatial.outputs.version }}
    steps:
      # A budget D1 cannot read would fail the load after the site is out, so it stops here.
      - name: Check the D1 budget input
        if: github.event.inputs.d1_budget != ''
        env:
          D1_BUDGET: ${{ github.event.inputs.d1_budget }}
        run: |
          if ! [[ "$D1_BUDGET" =~ ^[[:space:]]*[0-9][0-9_,]*[[:space:]]*[kKmMgG]?[[:space:]]*$ ]]; then
            echo "::error::d1_budget '$D1_BUDGET' is not a count of rows, such as 10000000 or 10M"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the last release tag, which the real-data check compares the code with
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      # The same install as the build, since the libraries and the spatial extension are part of
      # every cache key.
      - run: pip install -e './pipeline[deploy]'
      # The extension build pinned in spatial-extension.json, from our copy in R2. The install
      # stops when the pin is not for the duckdb in pipeline/requirements.txt or the bytes are not
      # the pinned build.
      - run: python -m publicdata spine install
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # Every later job checks it installed the build this plan keyed on (PUBLICDATA_SPATIAL) and
      # stops when it did not.
      - name: Record the spatial extension
        id: spatial
        run: echo "version=$(python -c 'from publicdata.cache import spatial_version; print(spatial_version())')" >> "$GITHUB_OUTPUT"
      # The build cache lives in R2; a plan reads each entry's record alone. This job has no
      # /mnt/work, which only the build runner creates.
      - name: Pull the build cache's records
        if: env.HAS_CF == 'true' && !github.event.inputs.replace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m publicdata cache pull --cache "$RUNNER_TEMP/build-cache" --meta-only
      - name: Plan the shards
        id: plan
        env:
          CACHE: ${{ !github.event.inputs.replace && format('{0}/build-cache', runner.temp) || '' }}
        run: |
          if [ "$HAS_CF" != "true" ]; then
            echo "shards=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "shards=$(python -m publicdata shards --store store ${CACHE:+--cache "$CACHE"})" >> "$GITHUB_OUTPUT"
      # A version's key leaves the build code out, so a change to that code is checked against a
      # sample of real versions before a deploy reuses them. A pull request compares with its
      # base. A push compares with the last release tag, which only a deploy that passed the
      # check cuts, so a change whose deploy failed or was cancelled while it waited is checked
      # again by the next push. The sample's seed is the base and the code diff, so a retry or a
      # later push draws the same sample until the change is fixed or a tag moves past it.
      - name: Choose the versions the code change is checked against
        id: verify
        if: env.HAS_CF == 'true' && github.event_name != 'workflow_dispatch'
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          base=HEAD^1
          if [ "$EVENT" = "push" ]; then
            tag=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
            if [ -n "$tag" ]; then
              base="$tag"
            elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              base="$BEFORE"
            fi
          fi
          echo "Real-data check: the code is compared with $base ($(git rev-parse --short "$base"))" >> "$GITHUB_STEP_SUMMARY"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"
          before="$RUNNER_TEMP/before"
          mkdir -p "$before"
          for f in register.py cache.py; do
            git show "$base:pipeline/publicdata/$f" > "$before/$f" 2>/dev/null || rm -f "$before/$f"
          done
          # The base's copy of each changed register entry, to find the rebuild numbers raised, and
          # of each changed manifest, to find the notes a partition_by edit must add.
          { grep -E '^(register/.*\.yaml|store/.*/manifest\.json)$' "$RUNNER_TEMP/changed.txt" || true; } | while read -r f; do
            mkdir -p "$before/$(dirname "$f")"
            git show "$base:$f" > "$before/$f" 2>/dev/null || rm -f "$before/$f"
          done
          seed="$(git rev-parse "$base")-$(git diff "$base" HEAD -- pipeline/publicdata | sha256sum | cut -c1-16)"
          slugs=$(python -m publicdata verify plan --store store --seed "$seed" --changed "$RUNNER_TEMP/changed.txt" --before "$before" 2> plan.err) || { cat plan.err >&2; exit 1; }
          cat plan.err >&2
          { echo '```'; cat plan.err; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

  # Builds the sample from its sources with this code and compares every version, diff and
  # history archive a deploy would reuse with its cache entry. A difference fails the deploy and
  # names the dataset whose rebuild number the change must raise.
  verify:
    name: verify
    needs: plan
    if: ${{ needs.plan.result == 'success' && needs.plan.outputs.verify != '' }}
    runs-on: ubuntu-24.04
    # A hung build ends as a failure the deploy stops on, well inside the six-hour job limit.
    timeout-minutes: 150
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      PUBLICDATA_SPATIAL: ${{ needs.plan.outputs.spatial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-runner # zizmor: ignore[self-repository] actionlint cannot parse $/ yet; ./ is this event's own checkout
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-api-token-id: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Pull the sample's cache entries and sources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SLUGS: ${{ needs.plan.outputs.verify }}
        run: |
          read -ra slugs <<< "$SLUGS"
          python -m publicdata cache pull --cache "$BUILD_CACHE" --store "$STORE" --only "${slugs[@]}"
          python -m publicdata store pull --store "$STORE" --only "${slugs[@]}"
      - name: Build the sample and compare it with what a deploy reuses
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SLUGS: ${{ needs.plan.outputs.verify }}
        run: |
          set +e
          read -ra slugs <<< "$SLUGS"
          python -m publicdata verify run "${slugs[@]}" --store "$STORE" --cache "$BUILD_CACHE" --out "$DIST" --published r2://publicdata-dist > verify.log 2>&1
          rc=$?
          cat verify.log
          { echo '```'; sed 's/^::error:://' verify.log | tail -40; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $rc

  # Each shard builds its datasets' versions, pushes their dated files to R2, and hands the deploy
  # job the cache entries it wrote, with the files a pull request's preview serves. The shards
  # wait for the real-data check, since a dated file in R2 is written once and a build with code
  # the check rejects must never reach it.
  shard:
    name: shard ${{ strategy.job-index }}
    needs: [plan, verify]
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.verify.result == 'success' || needs.verify.result == 'skipped') && needs.plan.outputs.shards != '[]' }}
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      PUBLICDATA_SPATIAL: ${{ needs.plan.outputs.spatial }}
    strategy:
      matrix:
        slugs: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-runner # zizmor: ignore[self-repository] actionlint cannot parse $/ yet; ./ is this event's own checkout
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-api-token-id: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Pull the build cache from R2
        if: ${{ !github.event.inputs.replace }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SLUGS: ${{ matrix.slugs }}
        # Only the entries this shard's datasets key to, so no shard downloads the whole cache.
        run: |
          read -ra slugs <<< "$SLUGS"
          python -m publicdata cache pull --cache "$BUILD_CACHE" --store "$STORE" --only "${slugs[@]}"
      - name: Pull raw sources from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SLUGS: ${{ matrix.slugs }}
        run: |
          read -ra slugs <<< "$SLUGS"
          python -m publicdata store pull --store "$STORE" --cache "$BUILD_CACHE" --only "${slugs[@]}" catalogue
      # A cached version's Parquet, which a diff or the history archive reads, comes back from R2.
      - name: Build and gate
        env:
          SLUGS: ${{ matrix.slugs }}
          VERSIONED: ${{ github.event_name != 'pull_request' && '--versioned' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          touch "$RUNNER_TEMP/start"
          read -ra slugs <<< "$SLUGS"
          python -m publicdata build "${slugs[@]}" --no-site --store "$STORE" --out "$DIST" --cache "$BUILD_CACHE" --absent absent.json --published r2://publicdata-dist
          python -m publicdata gate "$DIST" --absent absent.json --versions-only
          python -m publicdata split --out "$DIST" --large "$DIST_LARGE" --limit-mib 24 ${VERSIONED:+"$VERSIONED"}
          df -h / | tail -1
      # Only dated files: the pages say which version is newest, so the deploy job writes them.
      - name: Push version files to R2
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REPLACE: ${{ github.event.inputs.replace }}
        run: python -m publicdata dist-push --large "$DIST_LARGE" --expect absent.json --dated-only ${REPLACE:+--replace $REPLACE}
      # The cache entries this build wrote or grew, and on a pull request the version files its
      # preview serves from Pages, its Parquet and SQLite included, which no cache entry keeps.
      # A production build pushed those to R2 above.
      - name: Pack the build
        env:
          JOB_INDEX: ${{ strategy.job-index }}
          SLUGS: ${{ matrix.slugs }}
        run: |
          mkdir -p /mnt/work/shard
          (cd "$BUILD_CACHE" && find . -mindepth 2 -maxdepth 2 -name meta.json -newer "$RUNNER_TEMP/start" -printf '%h\n') > entries.txt
          tar -C "$BUILD_CACHE" -I 'zstd -T0' -cf /mnt/work/shard/cache.tar.zst -T entries.txt
          : > built.txt
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            (cd "$DIST" && find d -path '*/v/*' -type f ! -name 'index.*' ! -name manifest.json ! -name schema.json ! -name schema.sql) > built.txt
          fi
          tar -C "$DIST" -I 'zstd -T0' -cf /mnt/work/shard/built.tar.zst -T built.txt
          echo "Shard $JOB_INDEX: $(wc -l < entries.txt) cache entries, $(wc -l < built.txt) preview files, $SLUGS" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shard-${{ strategy.job-index }}
          path: /mnt/work/shard
          retention-days: 1
          compression-level: 0

  deploy:
    name: deploy
    needs: [plan, shard, verify]
    # A required check that is skipped counts as passed, so this runs and fails when the build did.
    # The plan skips itself for a fork's pull request, which builds from fixtures here instead.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_API_TOKEN_ID != '' }}
      PUBLICDATA_SPATIAL: ${{ needs.plan.outputs.spatial }}
    permissions:
      contents: read
      pull-requests: write # the preview URL comment
      issues: read # the open contributor issues the backlog and publisher pages link
    outputs:
      version: ${{ steps.release.outputs.version }}
      deployed: ${{ steps.pages.outcome == 'success' }}
      sign: ${{ steps.checksums.outputs.sign }}
    steps:
      - name: Stop when the build failed
        # A check that did not pass, timed out or cancelled included, stops it, so no tag is cut
        # past an unchecked change.
        if: ${{ needs.plan.result == 'failure' || needs.shard.result == 'failure' || (needs.verify.result != 'success' && needs.verify.result != 'skipped') }}
        env:
          PLAN: ${{ needs.plan.result }}
          SHARD: ${{ needs.shard.result }}
          VERIFY: ${{ needs.verify.result }}
        run: |
          echo "::error::plan $PLAN, shards $SHARD, real-data check $VERIFY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the tags, for scripts/next-version.mjs
      - uses: ./.github/actions/build-runner # zizmor: ignore[self-repository] actionlint cannot parse $/ yet; ./ is this event's own checkout
        with:
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-api-token-id: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          cloudflare-account-id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      # A pull request previews the version it would release; a push to main releases it; a
      # dispatched redeploy keeps the version already released, so no number goes untagged.
      - name: Resolve the release version
        id: release
        env:
          EVENT: ${{ github.event_name }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            V="$(node scripts/next-version.mjs "$PR_TITLE")-pr$PR"
          elif [ "$EVENT" = "push" ]; then
            V=$(node scripts/next-version.mjs)
          else
            V=$(node scripts/next-version.mjs --print-current)
          fi
          [ -n "$V" ] || { echo "::error::no release version resolved"; exit 1; }
          echo "PUBLICDATA_RELEASE=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Release $V" >> "$GITHUB_STEP_SUMMARY"
      # Version directories built from unchanged inputs and rebuild numbers are reused, keeping
      # only their small files; the rest were pushed to R2 by the job that made them, and the
      # Parquet the pages read comes back from there.
      # Only a push to main writes the cache, once every entry's files are in R2: after the
      # shards, which pushed theirs, and again after this job's own R2 push, which also deletes
      # the entries the build pruned.
      # A replace dispatch starts without the cache: the shards wrote every entry again.
      - name: Pull the build cache from R2
        if: env.HAS_CF == 'true' && !github.event.inputs.replace
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m publicdata cache pull --cache "$BUILD_CACHE"
      - name: Take the shards' builds
        if: needs.shard.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: shard-*
          path: /mnt/work/shards
      # A shard's entry replaces the restored one of the same key, which it grew. One artifact
      # downloads into the path itself, several into a folder each, so the archives are found.
      - name: Unpack the shards' builds
        if: needs.shard.result == 'success'
        run: |
          mkdir -p "$BUILD_CACHE"
          n=0
          for c in $(find /mnt/work/shards -name cache.tar.zst | sort); do
            s=$(dirname "$c")
            tar -I zstd -tf "$c" | cut -d/ -f2 | sort -u | while read -r k; do
              [ -n "$k" ] && rm -rf "${BUILD_CACHE:?}/$k"
            done
            tar -C "$BUILD_CACHE" -I zstd -xf "$c"
            mkdir -p "/mnt/work/built/$n"
            tar -C "/mnt/work/built/$n" -I zstd -xf "$s/built.tar.zst"
            rm -f "$c" "$s/built.tar.zst"
            n=$((n + 1))
          done
          [ "$n" -gt 0 ] || { echo "::error::no shard archives were downloaded"; exit 1; }
          df -h / | tail -1
      # Saved before this job builds anything, so a deploy that fails later keeps the shards' work.
      # The restored entries no version uses are dropped first, as the build would drop them.
      - name: Drop the entries no version uses
        if: env.HAS_CF == 'true' && github.event_name != 'pull_request' && needs.shard.result == 'success'
        run: python -m publicdata cache-prune --store "$STORE" --cache "$BUILD_CACHE"
      - name: Save the shards' versions
        if: env.HAS_CF == 'true' && github.event_name != 'pull_request' && needs.shard.result == 'success'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m publicdata cache push --cache "$BUILD_CACHE"
      # Source bytes are pulled only for versions the cache does not hold.
      - name: Pull raw sources from R2
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m publicdata store pull --store "$STORE" --cache "$BUILD_CACHE"
      # The backlog and publisher pages link each dataset's open contributor issue. GitHub being
      # unreachable costs the notices, not the deploy.
      - name: Read the open contributor issues
        if: env.HAS_CF == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m publicdata contribute issues --out contribute.json || {
            echo "::warning::the open contributor issues could not be read; the pages show none"
            echo '{}' > contribute.json
          }
      - name: Build and gate
        env:
          VERSIONED: ${{ github.event_name != 'pull_request' && '--versioned' || '' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The MCP server's bundle carries the release, so its tool file is rewritten with it.
          python -m publicdata.api_text
          if [ "$HAS_CF" = "true" ]; then
            mapfile -t built < <(find /mnt/work/built -mindepth 1 -maxdepth 1 -type d -printf '--built\n%p\n' 2>/dev/null)
            python -m publicdata build --store "$STORE" --out "$DIST" --cache "$BUILD_CACHE" --absent absent.json --search catalogue-search.sqlite --tasks contribute.json --published r2://publicdata-dist "${built[@]}"
          else
            echo "No Cloudflare secrets: building from fixtures, no deploy." >> "$GITHUB_STEP_SUMMARY"
            python -m publicdata build --fixtures --out "$DIST"
          fi
          [ -f absent.json ] || echo '[]' > absent.json
          python -m publicdata gate "$DIST" --absent absent.json
          # The cap is the account's, read from the project's upload token; the summary keeps the
          # count beside it, so the deploy warns well before Pages would refuse it. A cap that
          # cannot be read is not checked, so a failed read never stops a deploy Pages would take.
          cap=$(python -m publicdata pages-cap) || cap=
          if [ -z "$cap" ]; then
            echo "::warning::The Pages file cap could not be read from the account, so the deploy does not check its file count against it"
          fi
          status=0
          python -m publicdata split --out "$DIST" --large "$DIST_LARGE" --limit-mib 24 ${cap:+--max-files "$cap"} ${VERSIONED:+"$VERSIONED"} > split.log 2>&1 || status=$?
          cat split.log
          if [ -n "$cap" ]; then
            grep 'left for Pages' split.log >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "split: $(find "$DIST" -type f | wc -l) file(s) left for Pages. The Pages file cap could not be read from the account, so this count was not checked against it." >> "$GITHUB_STEP_SUMMARY"
          fi
          [ "$status" -eq 0 ] || exit "$status"
          df -h / | tail -1
      - name: Push version files to R2
        if: env.HAS_CF == 'true' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        # The shards pushed every dated file, replaced ones included, so this push is the pages and
        # dataset files, and a check that every file the build left out is in R2 and every
        # version's publisher's file is in the raw store.
        run: python -m publicdata dist-push --large "$DIST_LARGE" --expect absent.json
      - name: Save built versions
        if: env.HAS_CF == 'true' && github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m publicdata cache push --cache "$BUILD_CACHE" --prune
      # Live account data, so it goes in after the build; a figure that cannot be read is marked
      # unavailable and never stops the deploy. Its token holds Account Analytics Read and nothing else.
      - name: Measure stored bytes for health.json
        if: env.HAS_CF == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        timeout-minutes: 3
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python -m publicdata measure "$DIST/health.json"
      - name: Deploy to Cloudflare Pages
        id: pages
        if: env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
        run: |
          npx --no-install wrangler pages deploy "$DIST" --project-name publicdata-au --branch "$BRANCH" --commit-dirty=true | tee deploy.log
          grep -Eo 'https://[a-z0-9.-]+\.pages\.dev' deploy.log | tail -1 > url.txt
      # Made from the hashes R2 stored with each file, so the build and its cache key never see it.
      # Straight after the site goes live, which links each list. A failure leaves the lists for the
      # next deploy to catch up, so it never fails the deploy or holds back D1 and the release.
      # Before the purge, so the edge drops a replaced version's old list with its other files.
      - name: Write each version's SHA256SUMS
        id: checksums
        if: ${{ !cancelled() && env.HAS_CF == 'true' && github.event_name != 'pull_request' && steps.pages.outcome == 'success' }}
        continue-on-error: true
        # The first run hashes every version that has no list. Each list is kept as it is written,
        # so a run stopped here leaves the rest to the next deploy and the D1 load is not held up.
        timeout-minutes: 20
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REPLACE: ${{ github.event.inputs.replace }}
        run: |
          python -m publicdata checksums --root "$DIST" --root "$DIST_LARGE" ${REPLACE:+--replace $REPLACE} --subjects "$RUNNER_TEMP/lists"
          if [ -s "$RUNNER_TEMP/lists/1.sha256" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"; fi
          if [ -e "$RUNNER_TEMP/lists/2.sha256" ]; then
            echo "::warning::over 1,024 lists were written, so only the first 1,024 are signed; run the Checksums workflow to sign the rest"
          fi
      - name: Hand the lists written to the signing job
        if: ${{ !cancelled() && steps.checksums.outputs.sign == 'true' }}
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: checksum-lists
          path: ${{ runner.temp }}/lists/1.sha256
          retention-days: 1
      # A dated file is cached at the edge as immutable, so the versions a replace rewrote are
      # purged, or the edge serves the old files for a year.
      - name: Purge replaced versions from the edge
        if: env.HAS_CF == 'true' && github.event.inputs.replace
        env:
          CLOUDFLARE_PURGE_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}
          REPLACE: ${{ github.event.inputs.replace }}
        run: |
          if [ -z "$CLOUDFLARE_PURGE_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_PURGE_TOKEN is not set, so the edge serves the old files under $REPLACE until they are purged by hand"
            exit 0
          fi
          read -ra replace <<< "$REPLACE"
          python -m publicdata purge "${replace[@]}"
      # The query API reads D1. Loading runs after the site deploy so a failed load never holds the
      # site back, and stays off until the repository variable D1_ENABLED is true. Only main loads,
      # so the concurrency group above keeps one load at a time.
      - name: Load new versions into D1
        if: env.HAS_CF == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.D1_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          D1_BUDGET: ${{ github.event.inputs.d1_budget }}
          D1_RETRY: ${{ github.event.inputs.d1_retry }}
        run: |
          # Only a database that has never been loaded may be read as empty; any other error stops.
          # _orders records the row order each version was loaded in, so one loaded in another
          # order than its Parquet's loads again.
          if ! npx --no-install wrangler d1 execute publicdata --remote --json \
              --command "CREATE TABLE IF NOT EXISTS _orders (slug TEXT NOT NULL, version TEXT NOT NULL, ord TEXT NOT NULL, PRIMARY KEY (slug, version)); SELECT v.slug, v.version, v.fields, (SELECT o.ord FROM _orders o WHERE o.slug = v.slug AND o.version = v.version) AS ord FROM _versions v" > loaded.json 2> list.err; then
            if grep -q "no such table" list.err loaded.json; then echo '[]' > loaded.json; else cat list.err loaded.json; exit 1; fi
          fi
          python -m publicdata d1 sql --root "$DIST" --root "$DIST_LARGE" --loaded loaded.json --out d1-load --stamp "$GITHUB_RUN_ID" --catalogue catalogue-search.sqlite
          python -m publicdata d1 load --dir d1-load --budget "${D1_BUDGET:-0}" --retry "$D1_RETRY" --summary "$GITHUB_STEP_SUMMARY"
      # The MCP server answers counts from a version's rollup in R2 before any other engine, so
      # rollups follow what D1 holds after the load, plus every version of a query: false entry.
      # A rollup is written again when its version's Parquet changes, and the rest are deleted.
      - name: Write rollups for the versions queries reach
        if: env.HAS_CF == 'true' && github.event_name != 'pull_request' && vars.D1_ENABLED == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN_ID: ${{ secrets.CLOUDFLARE_API_TOKEN_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REPLACE: ${{ github.event.inputs.replace }}
        run: |
          npx --no-install wrangler d1 execute publicdata --remote --json \
            --command "SELECT slug, version, rows, fields FROM _versions" > held.json
          python -m publicdata rollup --loaded held.json --root "$DIST" --root "$DIST_LARGE" --out rollups ${REPLACE:+--replace $REPLACE}
      - name: Comment the preview URL
        if: env.HAS_CF == 'true' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          BODY="Preview: https://pr-$PR.publicdata-au.pages.dev (this deploy: $(cat url.txt))"
          # Edit only our own preview comment. --edit-last would rewrite whatever the bot posted most recently, such as the review.
          ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" | jq -rs 'add | [.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("Preview: "))] | last | .id // empty')
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$ID" -f body="$BODY" >/dev/null
          else
            gh pr comment "$PR" --body "$BODY"
          fi

  # One attestation for the lists the deploy wrote. It is a job of its own so that only a deploy
  # of main can sign: the deploy job also runs a pull request's code. Like the lists, a failure
  # waits for the Checksums workflow to sign again, and never fails the deploy.
  sign:
    name: sign
    needs: deploy
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.deploy.outputs.sign == 'true' }}
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the OIDC token Sigstore certifies to sign the attestation
      attestations: write # stores the attestation with the repository
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: checksum-lists
          path: lists
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: lists/1.sha256

  # Tags the released version and cuts a GitHub release with generated notes, then publishes the
  # MCP Registry entry when what a client sees has changed. A separate job, so the write token never
  # meets the build. Every step tolerates a re-run or a concurrent deploy that got there first.
  release:
    name: release
    needs: deploy
    # A deploy with no changed versions skips its shards; without !cancelled() that skip would
    # pass down and skip the release too.
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write # pushes the release tag and creates the GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # zizmor: ignore[artipacked] the tag push below goes with this credential
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: pip install -e ./pipeline
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.deploy.outputs.version }}
        run: |
          V="v$VERSION"
          git fetch --quiet origin "refs/tags/$V:refs/tags/$V" 2>/dev/null || true
          if git rev-parse -q --verify "refs/tags/$V" >/dev/null; then
            echo "Tag $V already exists."
            exit 0
          fi
          git tag "$V"
          if ! git push origin "$V" 2>push.err; then
            grep -qiE 'already exists|rejected' push.err && { echo "Tag $V was pushed by another run."; exit 0; }
            cat push.err >&2
            exit 1
          fi
          if ! gh release create "$V" --title "$V" --generate-notes 2>release.err; then
            grep -qiE 'already.exists' release.err && exit 0
            cat release.err >&2
            exit 1
          fi
      - name: Publish to the MCP Registry if the server changed
        id: registry
        env:
          KEY: ${{ secrets.MCP_REGISTRY_KEY }}
          PUBLICDATA_RELEASE: ${{ needs.deploy.outputs.version }}
          PUBLISHER_VERSION: 1.8.1
          PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          if [ -z "$KEY" ]; then
            echo "MCP_REGISTRY_KEY is not set, so the registry entry was left as it is." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          python -m publicdata.api_text server.json
          # A 404 means nothing is published yet. Any other failure skips, and the next release retries.
          code=$(curl -sS -o live.json -w '%{http_code}' "https://registry.modelcontextprotocol.io/v0.1/servers/au.publicdata%2Fmcp/versions/latest" || echo 000)
          if [ "$code" = "404" ]; then
            echo '{}' > live.json
          elif [ "$code" != "200" ]; then
            echo "::warning::the MCP Registry answered $code, so the entry was not compared or published"
            exit 0
          fi
          live=$(cat live.json)
          # Only the hash is compared, since the registry may add fields of its own to the entry.
          same=$(LIVE="$live" python -c "import json,os;h=lambda s:(s.get('_meta') or {}).get('io.modelcontextprotocol.registry/publisher-provided',{}).get('surface_sha256');print(h(json.load(open('server.json')))==h(json.loads(os.environ['LIVE']).get('server',{})))")
          if [ "$same" = "True" ]; then
            echo "The MCP Registry entry is current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          f="$RUNNER_TEMP/mcp-publisher.tar.gz"
          curl -fsSL -o "$f" "https://github.com/modelcontextprotocol/registry/releases/download/v${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "$PUBLISHER_SHA256  $f" | sha256sum -c -
          tar xzf "$f" -C "$RUNNER_TEMP" mcp-publisher
          "$RUNNER_TEMP/mcp-publisher" login http --domain publicdata.au --private-key "$KEY"
          "$RUNNER_TEMP/mcp-publisher" publish server.json
          echo "Published au.publicdata/mcp $PUBLICDATA_RELEASE to the MCP Registry." >> "$GITHUB_STEP_SUMMARY"
          echo "published=true" >> "$GITHUB_OUTPUT"
      # Smithery keeps its own scan of the tools, so it is refreshed whenever the registry entry is.
      - name: Refresh the Smithery listing
        if: steps.registry.outputs.published == 'true'
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
          SMITHERY_CLI: 4.11.1
        run: |
          if [ -z "$SMITHERY_API_KEY" ]; then
            echo "SMITHERY_API_KEY is not set, so the Smithery listing was left as it is." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if npx --yes "@smithery/cli@$SMITHERY_CLI" mcp publish https://publicdata.au/mcp -n national-digital/publicdata-au 2>smithery.err; then
            echo "Refreshed national-digital/publicdata-au on Smithery." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::the Smithery publish failed, so its listing still shows the previous tools"
            { echo "Smithery publish failed:"; echo '```'; tail -20 smithery.err; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # The listing's name, description, homepage and icon are Smithery's own fields, which a publish
      # does not set, so every release writes back any that drifted and fails if one will not hold.
      - name: Keep the Smithery listing's fields
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: python -m publicdata.smithery sync
