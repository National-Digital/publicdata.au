[project]
name = "publicdata-au"
version = "0.5.0"
description = "Query and download Australian government open data from publicdata.au."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "National Digital" }]
keywords = ["australia", "open data", "government data", "publicdata.au"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=14"]
duckdb = ["duckdb>=1.1"]
geo = ["geopandas>=0.14", "pyogrio>=0.7"]
dev = ["pytest>=8", "ruff==0.16.10"]

[project.urls]
Homepage = "https://publicdata.au/"
Documentation = "https://publicdata.au/agents/"
Source = "https://github.com/National-Digital/publicdata.au/tree/main/clients/python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publicdata_au"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  # A type-checking change will enable these with real annotations.
  "ANN",
  # These two fight ruff format, which owns trailing commas and joined strings.
  "COM812",
  "ISC001",
  # No file carries a copyright header; LICENSE covers the code.
  "CPY",
  # ruff format owns line length.
  "E501",
  # Exceptions are named for what happened (SiteUnreachable), and their names are public API.
  "N818",
]

[tool.ruff.lint.pydocstyle]
# The docstrings open with their summary on the first line and often describe what a function
# gives back, which Google's convention allows and PEP 257's imperative mood would rewrite.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# pytest asserts with assert, and an expected value reads more plainly as a literal. The tests
# are not a package, and only the public API in src/ needs docstrings. A stand-in takes the
# signature of what it replaces, and a test may call the private helper it tests. A Parquet
# timestamp in a fixture has no zone, as the data has none.
"tests/**" = ["S101", "PLR2004", "D1", "INP001", "ARG", "SLF001", "DTZ001"]
# The public keyword arguments format= and all= read as the words a caller means, and renaming
# them would break callers. Every URL the client opens is built on its base URL, which is
# https://publicdata.au unless the caller names another.
"src/publicdata_au/__init__.py" = ["A002", "S310"]
