[project]
name = "publicdata-au"
version = "0.5.0"
description = "Query and download Australian government open data from publicdata.au."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "National Digital" }]
keywords = ["australia", "open data", "government data", "publicdata.au"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=14"]
duckdb = ["duckdb>=1.1"]
geo = ["geopandas>=0.14", "pyogrio>=0.7"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://publicdata.au/"
Documentation = "https://publicdata.au/agents/"
Source = "https://github.com/National-Digital/publicdata.au/tree/main/clients/python"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/publicdata_au"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]
