faq:
- q: What does each row hold?
  a: One state, territory or country a driver licence came from, with the number of licences transferred
    to Victoria in the quarter for holders living in metropolitan Melbourne, in rural Victoria and
    elsewhere. The category marks interstate transfers as `INTE` and overseas ones as `OVSE`.
- q: Which quarter is it?
  a: Each version is the newest quarter the department has released, named on the portal. Earlier
    quarters are listed there as separate files.
- q: Is this a count of people moving to Victoria?
  a: It counts licences transferred, which is one sign of people moving. People who do not hold a licence,
    or who do not transfer it, are not counted. State names are as the register holds them, including
    its spelling.
summary: The number of interstate and overseas driver licences transferred to Victoria in the quarter, by
  the state or country they came from and whether the holder lives in Melbourne or rural Victoria.
description: Quarterly driver licence transfers to Victoria from the Department of Transport and Planning,
  one row per state, territory or country of origin, with the code of origin, the interstate or overseas
  category and the counts for metropolitan, rural and other addresses.
