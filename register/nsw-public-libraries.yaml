faq:
- q: What is in each row?
  a: One feature of the NSW Points of Interest layer that Spatial Services types as a library. Each row
    has the feature's name and label, the dates Spatial Services recorded for it, the publisher's
    urbanity code and its longitude and latitude.
- q: Are these only council libraries?
  a: No. The layer types a feature as a library without saying who runs it. Going by their names, most
    rows are council branch libraries. A small number are university or other institute libraries, such as Fisher Library
    at the University of Sydney. The layer gives no field that tells them apart.
- q: Does it give addresses or opening hours?
  a: No. The layer records a library's name and location only. It does not record an address, phone
    number, opening hours or the library service that runs it.
summary: The libraries in the NSW Points of Interest layer, one row per library, with each one's name and
  location.
description: The features that Spatial Services types `Library` in the NSW Points of Interest layer, read
  from its map service. Each row is one library, with its name and label, its topographic database id,
  the dates Spatial Services recorded for it, the publisher's urbanity code and the point's longitude
  and latitude in WGS84. The layer does not say who operates a library. Going by their names, most rows
  are council branch libraries. A small number are university or other institute libraries, which the layer types the
  same way. The layer records no address, phone number or opening hours.
