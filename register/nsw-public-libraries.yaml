    layer's own extent is stated in GDA94.
row_label: Libraries
fields:
- name: objectid
  label: Object id
  source: objectid
  type: integer
  description: The layer's row number, which the map service orders its answer by.
- name: name
  label: Library
  source: poiname
  type: string
  description: The library's name as Spatial Services records it, in capitals. It is empty for the few
    rows whose label type is `GENERIC`.
- name: label
  label: Label
  source: poilabel
  type: string
  description: The text the layer labels the point with. It is the name where there is one, and `Library`
    where there is not.
- name: label_type
  label: Label type
  source: poilabeltype
  type: string
  description: The publisher's `NAMED` or `GENERIC`, as published.
- name: alternative_label
  label: Alternative label
  source: poialtlabel
  type: string
- name: type
  label: Feature type
  source: poitype
  type: string
- name: urbanity
  label: Urbanity
  source: urbanity
  type: string
  description: The publisher's urbanity code, `U` or `S`, as published. The layer does not define the codes.
- name: topo_id
  label: Topographic database id
  source: topoid
  type: integer
- name: shape_uuid
  label: Shape UUID
  source: shapeuuid
  type: string
- name: start_date
  label: Start date
  source: startdate
  type: date
  date_format: epoch_ms
- name: last_update_ms
  label: Last updated (ms since 1970)
  source: lastupdate
  type: integer
  description: The time Spatial Services last updated the feature, as the map service gives it, in
    milliseconds since 1 January 1970 UTC. It is kept as a number because the values carry milliseconds.
- name: longitude
  label: Longitude
  source: (longitude)
  type: number
- name: latitude
  label: Latitude
  source: (latitude)
  type: number
omit:
  poigroup: A group code that is 1 for every library.
  poisourcefeatureoid: The internal number of the source feature class, which is the same for every library.
  accesscontrol: An access code that is the same for every library.
  enddate: An end date that holds the same placeholder, 1 January 3000, for every library.
  msoid: An internal maintenance id with no meaning outside the publisher's database.
  centroidid: A column the publisher leaves empty.
  changetype: An internal code for the publisher's last edit.
  processstate: A column the publisher leaves empty.
