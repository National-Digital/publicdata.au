faq:
- q: What is in each row?
  a: One feature of the NSW Points of Interest layer that Spatial Services types as a camping ground, a
    tourist park or home village, a roadside rest area or a boat ramp. Each row has the feature's type, its
    name and label, its topographic database id, the date Spatial Services recorded for it, the publisher's
    urbanity code and its longitude and latitude.
- q: How do I find only one kind of site?
  a: The feature type column holds the publisher's type for each row. Filter on `Camping Ground`,
    `Tourist Park / Home Village`, `Roadside Rest Area` or `Boat Ramp`.
- q: Why do some rows have no name?
  a: Spatial Services gives no name for about 1,290 of the 3,180 sites, most of them boat ramps and rest
    areas. Those rows have a blank name and a label such as `Boat Ramp` or `REST AREA`, as the layer serves
    them.
- q: How do these rest areas relate to the Transport for NSW rest areas list?
  a: They are a separate list from a different publisher. Spatial Services maps rest areas as topographic
    features, and Transport for NSW keeps its own list with facilities in the dataset nsw-rest-areas. This
    dataset serves the Spatial Services rows as published and does not match them to that list.
- q: Does it say what facilities a site has or whether I can stay overnight?
  a: No. The layer records a feature's type, name and location only. It does not record toilets, water,
    fees, opening times or how long a person may stay.
- q: Are launching ramps included?
  a: No. The layer has separate types called `Launching Ramp` and `Landing Ramp`, and this dataset reads the
    `Boat Ramp` type only.
summary: The camping grounds, tourist parks, roadside rest areas and boat ramps in the NSW Points of Interest
  layer, one row per site, with each one's type, name and location.
description: The features that Spatial Services types `Camping Ground`, `Tourist Park / Home Village`, `Roadside
  Rest Area` or `Boat Ramp` in the NSW Points of Interest layer, read from its map service page by page. Each
  row is one site, with the publisher's type, its name and label, its topographic database id, the date
  Spatial Services recorded for it, the publisher's urbanity code and the point's longitude and latitude
  in WGS84. The layer records no address, facilities or operator.
