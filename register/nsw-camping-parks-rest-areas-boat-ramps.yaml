fields:
- name: topo_id
  label: Topographic database id
  source: topoid
  type: integer
  description: The publisher's identifier for the feature in the NSW topographic database.
- name: type
  label: Feature type
  source: poitype
  type: string
  description: The publisher's type, `Camping Ground`, `Tourist Park / Home Village`, `Roadside Rest Area` or
    `Boat Ramp`, as published.
- name: name
  label: Site
  source: poiname
  type: string
  description: The site's name as Spatial Services records it, in capitals. It is empty for rows whose label
    type is `GENERIC` or `ALTERNATE`.
- name: label
  label: Label
  source: poilabel
  type: string
  description: The text the layer labels the point with. It is the name for a `NAMED` row, the type for a
    `GENERIC` row and the alternative label for an `ALTERNATE` row.
- name: label_type
  label: Label type
  source: poilabeltype
  type: string
  description: The publisher's `NAMED`, `GENERIC` or `ALTERNATE`, as published.
- name: alternative_label
  label: Alternative label
  source: poialtlabel
  type: string
- name: urbanity
  label: Urbanity
  source: urbanity
  type: string
  description: The publisher's urbanity code, `U` or `S`, as published. The layer does not define the codes.
- name: shape_uuid
  label: Shape UUID
  source: shapeuuid
  type: string
- name: start_date
  label: Start date
  source: startdate
  type: date
  date_format: epoch_ms
- name: longitude
  label: Longitude
  source: (longitude)
  type: number
- name: latitude
  label: Latitude
  source: (latitude)
  type: number
omit:
  objectid: The layer's row number, which the map service orders its pages by. It numbers rows in the
    publisher's database and is not the feature's identifier.
  poigroup: A group code that follows the feature type, one value for each type.
  poisourcefeatureoid: The internal number of the source feature class, one value for each type.
  accesscontrol: An access code that is the same for every row.
  enddate: An end date that holds the same placeholder, 1 January 3000, for every row.
  lastupdate: The time Spatial Services last edited the record. It records upkeep of the publisher's database
    and can move when the site has not changed, which would make a new version.
  msoid: An internal maintenance id with no meaning outside the publisher's database.
  centroidid: A column the publisher leaves empty.
  changetype: An internal code for the publisher's last edit, which moves with each edit.
  processstate: A column the publisher leaves empty.
