faq:
- q: What is in each row?
  a: One business day since 4 January 2011, with the cash rate target in force, any change announced that
    day, the interbank overnight cash rate the RBA publishes as the benchmark with its highest and lowest
    traded rates, the volume and number of cash market transactions, the cash rate total return index
    and the one, three and six month Treasury Note yields.
- q: Why are some columns blank for long stretches?
  a: The series start and stop at different dates. The one and three month Treasury Note yields run from
    January 2011 to 17 May 2013, and the six month yield has only 12 days, in March 2011. The traded high
    and low, the volume and the number of transactions start on 20 May 2013. The newest day can have
    only the total return index until the cash rate for that day is published.
- q: Why are the bank bill and overnight indexed swap (OIS) series not here?
  a: The RBA table also carries end-of-day bank accepted bill and negotiable certificate of deposit rates
    sourced from the ASX and overnight indexed swap rates sourced from FENICS. The RBA marks them as third
    party material that may not be republished without the owner's consent, so they are left out. The
    RBA-sourced series are all here.
- q: What does N/A in the source mean?
  a: The publisher writes N/A where a value was not observed, for example the traded high and low on a
    day with no transactions. It is kept as null.
- q: Under what licence is RBA data republished here?
  a: The RBA excludes its numerical data from the CC BY 4.0 licence that covers the rest of its site,
    and instead permits it to be used, reproduced, published and communicated to the public for personal
    or commercial use under sections 4 and 5 of its copyright notice, with attribution and no claim of
    endorsement. The RBA does not endorse this site or any use of this data, and it publishes the same
    figures free of charge at rba.gov.au. Every file here carries that attribution.
summary: The cash rate target, the interbank overnight cash rate with its daily high, low, volume and
  count, the cash rate total return index and Treasury Note yields, one row per business day since 2011.
  Updated each business day.
description: The RBA-sourced series of statistical table F1, Interest Rates and Yields, Money Market,
  one row per business day from 4 January 2011. The cash rate target and its changes, the interbank overnight
  cash rate and its highest and lowest traded rates, the volume in millions of dollars and number of transactions
  in the cash market, the cash rate total return index (4 January 2011 = 100) and the one, three and six
  month Treasury Note yields. The ASX and FENICS series in the RBA table are third party material and
  are not republished.
