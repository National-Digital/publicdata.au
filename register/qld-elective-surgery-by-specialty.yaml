slug: qld-elective-surgery-by-specialty
title: Elective surgery by specialty and hospital, Queensland, each quarter
status: live
topics:
- health
order: 228
collection: qld-elective-surgery
collection_title: Elective surgery performance by hospital, Queensland
search_title: Queensland elective surgery by specialty and hospital (Queensland Health)
also_known_as:
- Elective surgery by specialty Queensland
- QLD orthopaedic surgery waiting list
- Queensland hospital surgery waiting by specialty
keywords:
- elective surgery
- waiting list
- surgical specialty
- orthopaedics
- hospital performance
- Queensland Health
faq:
- q: What is in each row?
  a: One public hospital and one surgical specialty, such as general surgery, orthopaedics or ear, nose and throat (ENT) surgery,
    or `ALL`, for the quarter, with the patients treated and the share treated within the recommended time,
    the patients waiting, the long waits and the share waiting within the recommended time.
- q: What does a dash mean?
  a: Queensland Health writes a dash where it gives no figure for a hospital, such as a percentage with
    no patients behind it. Those cells are null here and flagged as suppressed. A few cells read `NULL`,
    and those are null too.
- q: Which quarter is it?
  a: Each version holds one quarter, named in the quarter ending field. Queensland Health adds a file for
    each quarter, and this table follows the newest, so each new quarter becomes a new version. The first
    version here is the quarter ending September 2025. A version's as-at date is the last day of its
    quarter, read from the name Queensland Health gives the file.
summary: Elective surgery at each Queensland public hospital each quarter by surgical
  specialty, with patients treated, patients waiting and the share within the recommended time.
description: Queensland Health elective surgery summary 2 for the newest quarter, one row
  per public hospital and surgical specialty. Each row has the volumes treated and waiting, the long waits,
  and the percentages treated and waiting within the clinically recommended time.
publisher:
  name: Queensland Health
  short: Queensland Health
  jurisdiction: Qld
  url: https://www.health.qld.gov.au/
licence:
  id: CC-BY-4.0
  reviewed: '2026-10-01'
  evidence: https://www.data.qld.gov.au/dataset/elective-surgery
  attribution: Queensland Health, Queensland Government, Elective surgery, sourced {sourced}, https://www.data.qld.gov.au/dataset/elective-surgery,
