faq:
- q: What is in each row?
  a: One financial year from 2013-14, one police region and district, and one offence code, with the number
    of infringement notices or charges issued for that offence. The Breach or Ticket column says which,
    with T for a ticket (infringement notice) and B for a breach (charge).
- q: Why are recent counts lower?
  a: The department allows a three month lag before it extracts the data, and it notes that some categories,
    such as drink driving, stay understated for longer because those matters take time to finalise. The
    figures can change as offences are finalised.
- q: What are the last rows?
  a: The publisher ends the file with three rows of notes about the extract. They are kept as published,
    so their text sits in the financial year column and the other columns are empty.
- q: Why does North Brisbane have so many offences?
  a: Almost every camera-detected offence in the file is recorded against the North Brisbane police district,
    and no other district has more than a few dozen. Toll offences are all recorded under the `UNKNOWN` region. Compare
    districts on offences that are not camera or toll offences.
summary: The number of traffic infringement notices and charges issued in Queensland each financial year
  since 2013-14, by police region and district and by offence code and description.
description: Counts of traffic offence infringement notices and charges issued in Queensland from 1 July
  2013, one row per financial year, police region, police district and offence. Each row names the offence
  type, code and description and whether it was a ticket or a breach. The Department of Transport and
  Main Roads extracts it from its registration and licensing system, TRAILS, once a year.
