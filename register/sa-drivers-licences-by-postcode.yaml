faq:
- q: What is in each row?
  a: The number of current driver's licences of all kinds, full and provisional, for cars, motorcycles and other
    vehicles, held by people of one age and sex in one postcode at the end of the quarter.
- q: What are the Total and TRLB05 rows?
  a: The publisher ends the table with a Total row and a footer row naming the report and page. Both are kept as
    published. The footer's count reads `DPTI` and is a null here.
- q: Which date does the table cover?
  a: The newest quarter, the end of June 2026 at the first version. The publisher adds a file each quarter, and
    each becomes a version here.
summary: The number of current driver's licences in South Australia at the end of the newest quarter, by holder's
  postcode, age and sex. Updated quarterly.
description: Drivers' Licences by postcode, age and sex from the Department for Infrastructure and Transport, which
  refers to the report as TRLB05. Each row is one postcode, age and sex, with the number of current licences of all
  types held, including full and provisional car, motorcycle and other licences.
