collection_description: |
  Queensland Health publishes three live tables behind its emergency department wait time pages. One lists the public hospital emergency departments and minor injury and illness clinics, one gives the number of people waiting and the median wait at each right now, and one gives the usual busyness of each by day of the week and hour.

  The publisher refreshes them through the day. This site reads them once a day, and each day they change is one version, so the archive holds a daily snapshot.
faq:
- q: What is in each row?
  a: One public hospital emergency department or minor injury and illness clinic (MIIC) in the publisher's
    wait time pages, with its facility code, name, address, phone, coordinates, the number of treatment
    spaces and when it was last updated, its opening hours and days, its website and any alert message
    the publisher shows.
- q: Why do the description and alert text contain tags?
  a: The publisher stores those columns as HTML for its web pages. They are kept as published.
summary: Every public emergency department and minor injury and illness clinic in Queensland Health's
  live wait time data, with address, coordinates, treatment spaces and opening hours.
description: The facility list behind Queensland Health's emergency department wait time pages, one row
  per hospital emergency department or minor injury and illness clinic, with its code, name, address,
  phone, latitude and longitude, treatment spaces, opening hours and days, website, First Nations name
  where given, and the alert message shown on its page. The publisher stamps every row with the time of
  its last upload.
