faq:
- q: What is in each row?
  a: The number of vehicles registered in South Australia at the end of the quarter with one body type, such as
    sedan, solo motorcycle or box trailer, with the vehicle type and the group it falls in.
- q: What are the Total and TRLB03 rows?
  a: The publisher ends the table with a Total row for all vehicles and a footer row naming the report and page.
    Both are kept as published. The footer's count reads `DPTI` and is a null here.
- q: Which date does the table cover?
  a: The newest quarter, the end of June 2026 at the first version. The publisher adds a file each quarter, and
    each becomes a version here. The files back to 2010 stay on the portal.
summary: The number of vehicles registered in South Australia at the end of the newest quarter, by body type within
  each vehicle type. Updated quarterly.
description: Registered vehicles by body type and vehicle type from the Department for Infrastructure and Transport,
  which refers to the report as TRLB03. Each row is one body type with the vehicle type, such as vehicle, motorcycle
  or trailer, the group it falls in, such as cars or buses, and the number registered.
