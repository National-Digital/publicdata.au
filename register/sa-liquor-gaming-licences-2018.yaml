faq:
- q: What is in each row?
  a: One liquor licence current or suspended in September 2018, with its licence number, the premises' name and
    address, the liquor licence status and issue date, four yes or no flags the publisher sets on the licence, and
    where the premises also holds a gaming machine licence, its status, issue date and number of machines.
- q: Is this the current list?
  a: No. It is the September 2018 snapshot. The portal also holds earlier snapshots from 2013 to 2017 and a
    later one from August 2019. Venues may have opened, closed or changed since.
- q: What does NULL mean?
  a: The publisher writes NULL where a field is empty, such as the gaming columns for premises without gaming
    machines. Those cells are null here.
summary: Every liquor licence in South Australia in September 2018 with its premises, status and issue date, and
  the gaming machine licence and number of machines where the premises held one. Closed snapshot.
description: The Liquor and Gaming Licences list from Consumer and Business Services, published by the
  Attorney-General's Department, as at September 2018. Each row is one licence with its identifier and number, the
  premises' name, address, town and postcode, the liquor licence status and date issued, the publisher's `EN`, `ET`, `EX`
  and C flags, and the gaming licence status, date issued and number of gaming machines. The premises' phone and fax
  numbers are left out.
