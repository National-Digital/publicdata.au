faq:
- q: What is in each row?
  a: One pair of a suburb or locality and a postal area that it shares population with, as the ABS publishes the pair
    in its 2021 correspondence. A suburb that lies in one postal area has one row with a ratio of 1. A suburb split
    across postal areas has a row for each, and its ratios add to 1.
- q: How is the ratio worked out?
  a: The ABS weights its standard correspondences by where people live, using population modelled to residential
    address locations. The ratio is the share of the suburb's population that the ABS places in the postal area.
    This site publishes the ratio as the ABS gives it and computes none of its own.
- q: What do the quality columns mean?
  a: The ABS rates each row and the whole correspondence as Good, Acceptable or Poor, by how well it expects data to
    convert from the suburb to the postal area. The flag `bmos_null_flag` is 0 for an ordinary row and 1 for a row
    whose ratio is below the ABS's minimum output size, usually 0.01.
- q: How does this join to other datasets here?
  a: The suburb code matches `sal_2021_code` in the ABS suburb and locality boundaries, and the postal area code
    matches `poa_2021_code` in the ABS postal area boundaries. Both codes are text, so Northern Territory postcodes
    keep their leading zero, such as 0800.
summary: The ABS correspondence from each of the 2021 suburbs and localities to the postal areas it falls in, with the
  ABS's population ratio and quality rating for each pair.
description: The file CG_SAL_2021_POA_2021.xlsx from the ABS ASGS Geographic Correspondences (2021) Edition 3. Each
  row is one suburb or locality and one postal area, with the share of the suburb's population that the ABS places
  in that postal area and the ABS's quality indicators. The ABS rows for no usual address, migratory, offshore and
  shipping, and outside Australia are kept, so every ABS code is in the table.
