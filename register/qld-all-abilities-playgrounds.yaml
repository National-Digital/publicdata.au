faq:
- q: What is in each row?
  a: Each row is one all abilities playground on the Queensland Government's list. It gives the name, address,
    the play equipment and facilities, a web link, image names and descriptions, the council to contact, and
    the coordinates.
- q: Is this every accessible playground in Queensland?
  a: No. It lists the 17 playgrounds on the publisher's all abilities playgrounds list. Councils run many other
    accessible playgrounds that are not in this file.
summary: The 17 all abilities playgrounds on the Queensland Government's list, with their equipment, facilities,
  contacts and coordinates.
description: 'One row per all abilities playground on the Queensland Government''s list. Each row gives the
  playground name, street address, suburb and postcode, the play features and facilities, a web link where
  one is given, the names and captions of four images, the council to contact and the latitude and longitude.

  '
