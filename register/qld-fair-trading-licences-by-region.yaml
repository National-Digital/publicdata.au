faq:
- q: What is in each row?
  a: One type of occupational or industry licence the Office of Fair Trading administers, such as real
    estate, motor dealer, security provider or tattoo industry, with the number of distinct licences in
    each office region on the count date and a Grand Total row and column.
- q: What does a blank cell mean?
  a: The office leaves a cell blank where a region has none of that licence type in its table. Those cells
    are null here.
- q: When is the count taken?
  a: The office counts licences on 1 April and 1 October each year. The first version here is the count
    as at 1 April 2026.
summary: The number of occupational and industry licences the Queensland Office of Fair Trading administers,
  by licence type and office region, on the newest count date.
description: Counts of the distinct licences held under the occupational and industry licensing laws the
  Queensland Office of Fair Trading administers, one row per licence type, with one column for each office
  region and a Grand Total. The office publishes a count as at 1 April and 1 October each year, and this
  table follows the newest.
