faq:
- q: What is in each row?
  a: One recreation site in Victorian State forest, such as a camping area or a picnic area. Each row has
    the department's serial number for the site, its name, its site class, its access notes and fee, the
    work centre that maintains it, any closure in place, a flag and a description for each activity the
    site offers, the number of picnic tables and barbecues of each kind, and its longitude and latitude
    in GDA2020.
- q: How do I find the camping areas?
  a: The camping column is true where the department marks the site for camping. Where it is blank the
    record does not mark the site for camping. The campervanning column and the campervan type column
    say which sites take caravans or camper trailers.
- q: Do I have to pay to camp at these sites?
  a: The fee column holds the fee the department records for a site, as it writes it. Most rows leave it
    blank. A blank fee means the record states no fee. It does not confirm the site is free, so check the
    site's page on the Forests and Reserves website before you go.
- q: Is a site open now?
  a: The closure columns give the closure status, its reason, its description and its start and reopening
    times as the department last recorded them. The department changes these as fire, harvesting and
    maintenance close sites. A version here holds the closures in force on the day it was fetched, so check
    the department's current notices before you travel.
- q: Why are some activity columns blank in every row?
  a: The department's table has a column for each activity it can record, such as horse riding and rock
    climbing. Some of them hold no values today. They are published as they stand, so values the
    department adds later appear here.
summary: About 530 camping, picnic and other recreation sites in Victorian State forest, one row per site,
  with each site's class, activities, facilities, closures and coordinates, from DEECA.
description: The Recreation Sites layer, RECWEB_SITE, of the Department of Energy, Environment and Climate
  Action, read from the department's open web feature service. The department records each recreation site
  it maintains in State forest, mostly camping and picnic areas. Each row carries the site's serial number,
  name, site class, accessibility, access notes and fee, the work centre that maintains it, the closure the
  department has recorded, a flag and a description for each activity, the counts of picnic tables and
  barbecues of each kind, the date the record was last changed, and its longitude and latitude in GDA2020.
