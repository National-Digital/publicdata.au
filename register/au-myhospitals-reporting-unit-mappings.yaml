faq:
- q: What is in each row?
  a: One mapping the MyHospitals Data API lists for a reporting unit. It gives the unit's code, name and type,
    the type of mapping, and the code, name and type of the unit it maps to.
- q: How do I find a hospital's Local Hospital Network code?
  a: Take the rows whose reporting unit is the hospital and whose mapping type is H_LHN. The Institute lists
    the same mapping under the network as well, so a network's rows of that type name its hospitals. A
    hospital the Institute maps to no network, such as most private hospitals, has no H_LHN row.
- q: Why do some rows repeat?
  a: The Institute lists each state's and the nation's mapping to itself twice, and both rows are kept as
    served. The Institute has not endorsed this site.
summary: The Local Hospital Network, Primary Health Network and state each AIHW MyHospitals reporting unit
  maps to, about 5,900 rows, by code and name.
description: The mappings in the reporting units list of the AIHW MyHospitals Data API, one row for each
  mapping a unit lists. Each row has the unit's code, name and type, the mapping type, and the code, name
  and type of the unit it maps to.
