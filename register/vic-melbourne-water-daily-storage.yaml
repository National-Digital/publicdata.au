faq:
- q: What does each row hold?
  a: The volume held in one of Melbourne Water's ten storage dams on one day, in megalitres, and the
    share of the dam's capacity that volume is. Maroondah, O'Shannassy, Silvan and Yan Yean go back to
    1 January 1940. The others start when they came into the record.
- q: Why is the time 1 pm or 2 pm?
  a: The publisher's service stores each reading as a moment in UTC, so local midnight appears as 1 pm
    or 2 pm on the previous day depending on daylight saving. The value is kept as published. The
    volume itself is recorded at 8 am each day.
- q: Why does it stop in February 2020?
  a: The portal's file of the complete record ends on 29 February 2020 and has not been extended. Some
    days have no volume, and those cells are null.
summary: The volume of water in each of Melbourne Water's ten storage dams on every day from 1940 to
  February 2020, in megalitres and as a percentage of capacity.
description: Daily observed storage volumes from Melbourne Water for the Cardinia, Greenvale, Maroondah,
  O'Shannassy, Silvan, Sugarloaf, Tarago, Thomson, Upper Yarra and Yan Yean storages, one row per dam and
  day. Volumes are measured by telemetry at 8 am and checked against field observations. The record runs
  from 1 January 1940 to 29 February 2020, in local days.
