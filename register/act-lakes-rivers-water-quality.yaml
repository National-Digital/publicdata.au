faq:
- q: What is in each row?
  a: One measurement of one analyte in one sample, with the date, the site code and name, the site's
    coordinates, the depth or sample type, the analyte, the value and its unit.
- q: What do the less than and greater than values mean?
  a: The publisher writes a value outside the laboratory's limit of detection with a less than or greater
    than sign. The value is kept as text so those signs survive.
- q: How often are sites sampled?
  a: The publisher samples 20 sites in the ACT and one in Burrinjuck Reservoir six to eight times a year,
    in rivers, creeks, urban lakes and ponds. In lakes a probe takes a depth profile from the surface to
    the bottom.
summary: Water quality samples from the ACT Government's lakes and rivers monitoring program since 2015,
  one row per measurement with the site, depth, analyte, value and unit.
description: Results of the ACT Lakes and Rivers water quality monitoring program, which a NATA accredited
  laboratory runs for the ACT Government at 20 sites in the ACT and one in Burrinjuck Reservoir. Each row
  carries the sampling date and time, the site code and name, latitude and longitude, the depth in metres
  or the sample type (surface, bottom or depth-integrated tube), the analyte (24 physical, chemical and
  biological measures and the gauge height and flow), the value and the unit.
