faq:
- q: What is in each row?
  a: One day from 1 July 2018 to 31 December 2023 and one channel, such as Online Services, BPAY, Australia
    Post or a motor dealer, with the number of vehicle registration renewals paid that way.
- q: Why does it stop at 2023?
  a: The department last replaced the file in January 2024. This site checks it weekly and adds a version
    when it changes.
- q: Why does the Internet channel stop in April 2023?
  a: Internet runs to 3 April 2023 and Online Services starts on 4 April 2023, so add the two for online
    renewals across the whole period. `QGAP/QPS` and `Contact Centre` also start on 4 April 2023 and run beside
    `COC/QGAP/QPS` and `Call Centre` for the rest of the year.
