faq:
- q: What is in each row?
  a: One public toilet the ACT Government owns or manages, with its asset identifier and name, the park or
    place it is in, its type, whether it is active, whether it has an accessible cubicle, its cubicle,
    urinal and sink counts, when the public can use it, its water supply and toilet system, the suburb and
    address, the owner and maintainer, the date the record was last edited, and its coordinates.
- q: Does it list every public toilet in Canberra?
  a: No. The publisher lists the toilets that City Services or the Parks and Conservation Service in the
    City and Environment Directorate owns or manages. Toilets run privately, by other directorates or by
    the Federal Government may not be included.
- q: Why are some cubicle counts empty?
  a: The publisher leaves the count of male, female, unisex and accessible cubicles, urinals and sinks
    blank for about 90 of the 229 toilets. A blank count is kept blank here and is not read as zero.
- q: What licence applies?
  a: The layer is published under CC BY 4.0, and the ACTmapi terms of use apply in addition. Those terms
    add a disclaimer and a waiver and release of claims against the Territory. They place no limit on
    reuse.
summary: Every public toilet the ACT Government owns or manages, one row per toilet with its park, type,
  cubicles, opening hours, suburb and coordinates.
description: The public toilets in the ACT that the City and Environment Directorate owns or manages, from the
  Public Toilet Assets layer on ACTmapi. Each row carries the asset type and subtype, the asset identifier and
  name, the location, the operational state, whether there is an accessible cubicle, the number of male,
  female, unisex and accessible cubicles, urinals and sinks, the total cubicles, the hours or conditions of
  public access, the water supply and toilet system, the suburb, address, owner and maintainer, the date the
  record was last edited, the publisher's global identifier and the point's longitude and latitude.
