blocked_reason: The data.gov.au record names CC BY 3.0 AU, and the same record sets out the database's
  own terms of use. Clause 3.2 of those terms says a licensee may not sublicense its rights, and that
  anyone else who needs the database must obtain a copy from data.gov.au and accept the terms
  themselves. A copy served here could not pass on the right to reuse it. We asked the project team on
  1 October 2026 whether CC BY 3.0 AU applies to the whole database, and followed up on 15 October 2026.
  The Continence Foundation of Australia replied on 7 October 2026 that it is seeking advice from the
  Australian Government. It can be built once the department confirms the licence.
