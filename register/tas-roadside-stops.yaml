faq:
- q: What is in each row?
  a: One roadside stop on a Tasmanian state road, which the department types as a rest area, a heavy vehicle
    parking area or a roadside lookout. Each row has the road number and name, the site name and location,
    the direction of travel it serves, the authority, and whether the site has a car park, shelter, barbecue,
    toilet, rubbish bin, information sign, picnic area or playground.
- q: How accurate are the locations?
  a: The publisher's metadata says the stops were placed from a road asset spreadsheet and then moved to their
    actual positions using the orthophoto, topographic and cadastre layers of the Land Information System
    Tasmania, and that they are within 50 metres of the true position 90 per cent of the time.
summary: The rest areas, heavy vehicle parking areas and lookouts on Tasmania's state roads, with each stop's
  location and facilities, from the Department of State Growth on the Land Information System Tasmania.
description: The Roadside Stops (State Owned) layer of the Department of State Growth, read from its map service.
  Each row is one roadside stop on the State Government road network, with its type, road, site name, location,
  direction, authority, access and the facilities the department records. The layer is held in GDA94 Map
  Grid of Australia zone 55, and the map service gives each point's longitude and latitude in WGS84.
