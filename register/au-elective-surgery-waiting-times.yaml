faq:
- q: What is in each row?
  a: One public hospital or Local Hospital Network, one financial year from 2011-12 and one urgency
    category. It gives the number of elective surgeries, the median days waited, the share of patients
    treated within the recommended time, and the peer group's median and average beside them.
- q: What are the urgency categories?
  a: The treating doctor assigns each patient to urgent (surgery recommended within 30 days), semi-urgent
    (within 90 days) or non-urgent (within 365 days). The Institute notes that states and hospitals assign
    the categories differently, which affects comparisons.
- q: What do the blanks mean?
  a: The Institute writes `<5` for a count under five and `NP` where the data did not meet its criteria. Those
    cells are null here with a suppressed flag. A dash, meaning no patients were reported, and Not peered
    are null. The share within recommended time is a fraction, so 0.95 means 95 per cent.
summary: Median waiting times for elective surgery and the share treated within the recommended time,
  for each public hospital and network by urgency category each year since 2011-12, from AIHW MyHospitals.
description: The Urgency category sheet of the MyHospitals elective surgery waiting times data extract from
  the AIHW MyHospitals Data API. Each row is one reporting unit, financial year and urgency category, with
  the number of surgeries, the median waiting time in days, the percentage of surgeries within the
  recommended time and the peer group's median and average.
