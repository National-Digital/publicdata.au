faq:
- q: What is in each row?
  a: The zone of one government high school with a zone, with the school's name, its site number and its type. The
    shape is in the GeoParquet, GeoJSON, GeoPackage and PMTiles files.
- q: Does every school have a zone?
  a: No. Only the schools that manage their enrolments with a zone have one. A school gives priority enrolment to
    children who live inside its zone.
- q: Which year do the zones apply to?
  a: The zones for the newest enrolment year the publisher has released, the 2025 enrolment year at the first
    version. Each new year's layer becomes a version here.
summary: The zones of South Australian government high schools that take their core intake from a zone, one shape
  per school, for the newest enrolment year.
description: School Zones for South Australian Government High Schools from the Department for Education. A school
  zone is the area from which the school accepts its core intake, and the school gives priority enrolment to children
  who live inside it. Each row is one school's zone with its name, site number and type, `SEC` for a secondary school or `PRSEC` for a combined primary and secondary school.
