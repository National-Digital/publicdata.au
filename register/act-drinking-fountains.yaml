faq:
- q: What is in each row?
  a: One public drinking fountain or water refill station the ACT Government owns or manages, with its asset
    identifier and name, the park or place it is in, its type, whether it is active, its material, whether
    it has a dog bowl, whether it has disabled access, the suburb and address, the owner and maintainer, the
    date the record was last edited, and its coordinates.
- q: Does it list every drinking fountain in Canberra?
  a: No. The publisher lists the fountains that City Services or the Parks and Conservation Service in the
    City and Environment Directorate owns or manages. Fountains run privately, by other directorates or by
    the Federal Government may not be included.
- q: Are inactive fountains included?
  a: Yes. The publisher marks 18 of the 266 fountains `INACTIVE` in the operational state column, and they
    are kept as published.
- q: What licence applies?
  a: The layer is published under CC BY 4.0, and the ACTmapi terms of use apply in addition. Those terms
    add a disclaimer and a waiver and release of claims against the Territory. They place no limit on
    reuse.
summary: Every public drinking fountain and water refill station the ACT Government owns or manages, one row
  per fountain with its park, type, suburb and coordinates.
description: The public drinking fountains and water refill stations in the ACT that the City and Environment
  Directorate owns or manages, from the Drinking Fountain Assets layer on ACTmapi. Each row carries
  the asset type and subtype, the asset identifier and name, the location, the operational state, the
  material, whether there is a dog bowl, whether there is disabled access, the suburb, address, owner and
  maintainer, the date the record was last edited, the publisher's global identifier and the point's
  longitude and latitude.
