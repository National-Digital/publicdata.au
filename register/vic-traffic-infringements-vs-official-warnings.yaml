faq:
- q: What does each row hold?
  a: One kind of issuing agency for the quarter named on the row, such as fixed and mobile cameras,
    police on the spot, tolling or distracted driver and seatbelt cameras, with the infringements issued
    and the official warnings issued. The `TOTAL` row is the publisher's own.
- q: How do warnings relate to the fines?
  a: The publisher says an official warning is issued when an infringement is withdrawn after internal
    review, and a warning may not relate to infringements issued in the same period. Police on the spot
    figures cover speeding, red light and unregistered vehicle offences only.
- q: Why might tolling figures lag?
  a: Tolling infringements are counted at the date issued, which can be months after the trip, because
    an unpaid toll becomes an infringement only after the toll operator has tried to recover it.
- q: Which quarter is it?
  a: Each version is the newest quarter released, and the quarter is in each row, taken from the sheet's
    name. Earlier quarters back to 2019 are listed on the portal.
summary: The number of traffic infringements and official warnings issued in the quarter by cameras,
