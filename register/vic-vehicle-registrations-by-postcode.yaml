faq:
- q: What does each row hold?
  a: A count of vehicles on the Victorian register at the end of the quarter that share one make, vehicle
    class, year of manufacture, postcode and fuel type. Boats and trailers are not included.
- q: Why can the same combination appear more than once?
  a: The publisher's file repeats some combinations on separate rows, likely from attributes it does not
    publish. Rows are kept as published, so add the counts together for a total.
- q: What do the codes mean?
  a: Make is the register's six character make code, such as `TOYOTA` or `M G`. Vehicle class is a number and
    fuel type a one letter code, such as P, D and E, as the register holds them. The publisher does not
    publish a key to the codes with this file.
- q: Which quarter is it?
  a: Each version is the newest quarterly snapshot the department has released, named by quarter on the
    portal. The portal lists earlier quarters back to the second quarter of 2023 as separate files.
summary: The number of vehicles registered in Victoria at the end of the quarter in each postcode, by make,
  vehicle class, year of manufacture and fuel type. About a million rows.
description: The whole fleet vehicle registration snapshot by postcode from the Department of Transport
  and Planning. Each row is the count of registered vehicles that share a make, vehicle class, year of
  manufacture, postcode and fuel type at the end of a quarter. Boats and trailers are not included. The
  publisher notes that some words may be misspelt or attributes incorrect.
