collection_description: |
  The Department of Transport and Planning publishes counts of the vehicles registered in Victoria, drawn from the VicRoads register. Boats and trailers are not included.

  The whole fleet snapshot counts every registered vehicle at the end of a quarter, once by postcode, make, class, year of manufacture and fuel type and once by make, model and colour. A third table counts the new vehicles registered in each month by make, model, colour and year of manufacture.
