collection_title: Traffic volumes on Queensland state-controlled roads
collection_search_title: Queensland traffic count data
collection_description: |
  The Department of Transport and Main Roads (TMR) counts traffic at sites across the state-declared road network and publishes annual estimates from the counts.

  Traffic census has the annual average daily traffic at each count site for the latest eleven years, with counts by vehicle class. Traffic by hour and day of week has the average volume at each site for each hour of each day of the week in the latest year.
temporal_start: '2015-01-01'
