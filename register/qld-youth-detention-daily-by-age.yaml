collection_search_title: Queensland youth detention numbers by day
collection_description: 'Youth Justice in Queensland published the number of young people held in youth detention
  on each day from 1 July 2011 to 30 June 2016. The count covers young people remanded in custody or serving
  a sentenced detention order, and leaves out those held in youth detention on pre-court custody.


  The publisher released five tables, each splitting the same daily total a different way: by age group, by
  detention centre, by sex, by Aboriginal and Torres Strait Islander status and by legal status. Each table
  ends at 30 June 2016 and has not been extended.'
