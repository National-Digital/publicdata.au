faq:
- q: What is in each row?
  a: Each row is one day from 1 July 2011 to 30 June 2016, with the number of young people in youth detention
    that day split by age, and the total.
- q: Who is counted?
  a: Young people in youth detention who were remanded in custody or serving a sentenced detention order. Young
    people held on pre-court custody are not counted.
- q: Is there data after June 2016?
  a: The publisher has not extended these tables past 30 June 2016.
summary: The number of young people in Queensland youth detention on each day from July 2011 to June 2016,
  by age.
description: One row per day from 1 July 2011 to 30 June 2016, with the financial year, the date, the number
  of young people in youth detention that day in each age group and the total in detention. The count
  covers young people remanded in custody or sentenced, and leaves out pre-court custody.
