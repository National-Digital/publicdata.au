example:
  where: {category: ALL, facility_code: {neq: '99999'}}
  group: facility
  metric: sum.long_waits
  label: Patients waiting longer than recommended at each hospital, all urgency categories
chart:
  where: {category: {neq: ALL}, facility_code: {neq: '99999'}}
  split: category
  metric: sum.treated
  label: Patients treated
sample:
  where: {category: ALL, facility_code: {neq: '99999'}}
  order: [treated.desc]
  spread: none
  label: The ten hospitals that treated the most elective surgery patients in the quarter, all urgency categories,
    most first.
source:
  adapter: ckan-resource
  portal: https://www.data.qld.gov.au
  package: elective-surgery
  resource_match: Elective Surgery by Category
  url: https://www.data.qld.gov.au/dataset/elective-surgery
  encoding: utf-8-sig
  cadence: quarterly
  as_at_regex: ([A-Za-z]+ \d{4})\s*[–-]\s*Elective Surgery by
  backfill_from: '2025-06-30'
key:
- facility_code
- category
partition_by:
- category
suppression:
- '-'
row_label: Hospital categories
fields:
- name: facility_code
  label: Facility code
  source: Facility_Code
  type: string
  description: Kept as text.
- name: facility
  label: Hospital
  source: Facility_Name
  type: string
  description: A public hospital, or a group such as Queensland Reporting Hospitals for the state total.
- name: report_month
  label: Quarter ending
  source: Report_Month
  type: string
  description: The last month of the quarter, as the publisher writes it, such as Sep-25.
- name: category
  label: Urgency category
  source: Category
  type: string
  description: 1, 2, 3, or ALL for every category.
- name: treated
  label: Patients treated
  source: Vol_Treated
  type: integer
  description: The number of elective surgery patients treated in the quarter. Queensland Health describes it as the "number of elective surgery patients treated".
- name: percent_treated_in_time
  label: Treated in recommended time (%)
  source: Percent_Treated_InTime
  type: number
  description: Queensland Health describes it as the "percent of elective surgery patients treated within the clinically recommended time".
- name: percent_change_treated_on_prior_year
  label: Change in treated on a year before (%)
  source: Percent_Variation_Treated_Prior_Year
  type: number
  null_values:
  - 'NULL'
  description: Queensland Health describes it as the "variation in number of elective surgery patients treated between reporting month and same month in the previous year". A cell that reads NULL is null.
- name: waiting
  label: Patients waiting
  source: Vol_Waiting
  type: integer
  description: The number of patients on the elective surgery waiting list on the day after the quarter ends. The quarter ending September 2025, for example, counts the patients waiting on 1 October 2025. Queensland Health describes it as the "number of elective surgery patients waiting on the day after the month".
- name: long_waits
  label: Waiting longer than recommended
  source: Vol_LongWaits
  type: integer
  description: The number of patients waiting longer than the clinically recommended time for their urgency category on the day after the quarter ends. It counts patients ready for surgery and patients not ready for surgery. Queensland Health describes it as the "number of elective surgery patients waiting longer than the clinically recommended time on the day after the month".
- name: percent_waiting_in_time
  label: Waiting in recommended time (%)
  source: Percent_Waiting_InTime_Total
  type: number
  description: The share of patients waiting within the clinically recommended time on the day after the quarter ends, ready for surgery or not. Queensland Health describes it as the "percent of elective surgery patients waiting within the clinically recommended time on the day after the month".
- name: data_last_update
  label: Data last updated
  source: data_last_update
  type: date
  date_format: '%d/%m/%Y'
  description: The date Queensland Health last updated the figures.
- name: long_waits_ready_for_surgery
  label: Long waits, ready for surgery
  source: Vol_LongWaits_RFS
  type: integer
  description: The number of patients waiting longer than the clinically recommended time who were ready for surgery, on the day after the quarter ends. Queensland Health describes it as the "number of elective surgery patients waiting longer than the clinically recommended time on the day after the month" and lists it for patients ready for surgery.
- name: long_waits_not_ready_for_surgery
  label: Long waits, not ready for surgery
  source: Vol_LongWaits_NRFS
  type: integer
  description: The number of patients waiting longer than the clinically recommended time who were not ready for surgery, on the day after the quarter ends. Queensland Health describes it as the "number of elective surgery patients waiting longer than the clinically recommended time on the day after the month" and lists it for patients not ready for surgery.
- name: percent_waiting_in_time_ready_for_surgery
  label: Ready for surgery, waiting in time (%)
  source: Percent_Waiting_InTime_RFS
  type: number
  description: The share of patients ready for surgery who were waiting within the clinically recommended time on the day after the quarter ends. Queensland Health describes it as the "percent of elective surgery patients waiting within the clinically recommended time on the day after the month" and lists it for patients ready for surgery.
note: Cells were typed and headers were made snake_case. Rows were left alone.
