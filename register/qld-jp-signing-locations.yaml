faq:
- q: What is in each row?
  a: One place where volunteer Justices of the Peace or Commissioners for Declarations sit to witness
    and certify documents under the JPs in the Community program, with its address, coordinates, phone
    and the session times for each morning and afternoon of the week.
- q: Do I need an appointment?
  a: The file does not say. The sessions it lists are the times volunteers are rostered at each place,
    and the publisher notes some exceptions in the services and closures columns, such as no sessions
    on public holidays.
- q: What datum are the coordinates in?
  a: The publisher does not name one. They are published as given, and on a map they are read as WGS84.
summary: Every place in Queensland where volunteer Justices of the Peace and Commissioners for Declarations
  sit to witness documents, with address, coordinates and weekly session times.
description: The signing locations of the JPs in the Community program run by the Queensland Department
  of Justice, one row per location, such as a library or shopping centre. Each row has the address and
  postal address, latitude and longitude, phone, the session times for each morning and afternoon from
  Monday to Sunday, closures and the date the row was last updated. The department refreshes the file
  often.
