faq:
- q: Which dams are here?
  a: Every storage whose owner reports a daily storage volume to the Bureau of Meteorology under the Water
    Regulations 2008, about 540 dams, weirs and reservoirs in every state and territory, from Warragamba and
    Wivenhoe to small town supplies. Each row is one storage on one day with the validated daily mean volume
    in megalitres and the Bureau's quality code. The companion dataset of Australian water storages lists
    each storage with its owner, coordinates and full storage volume.
- q: Are the Seqwater and Sydney dams included?
  a: Both are included. The Queensland Bulk Water Supply Authority (Seqwater) reports Wivenhoe (station 143036A), Somerset
    (143305A), North Pine, Hinze, Baroon Pocket, Little Nerang, Leslie Harrison, Wyaralong, Moogerah, Maroon,
    Borumba, Enoggera, Gold Creek, Lake Manchester, Lake Kurwongbah, Lake MacDonald, Ewen Maddock and the
    other south east Queensland storages. WaterNSW reports the Sydney storages, Warragamba (212243), Avon,
    Cataract, Cordeaux, Nepean, Woronora, Prospect Reservoir, Tallowa, Fitzroy Falls, Wingecarribee and the
    Blue Mountains dams. The Bureau names many stations by the creek and dam wall, such as `Nerang R at Hinze
    Dam HW`, and lists some Sydney storages more than once under numbers such as 212243.1, so search by name
    and check the station number in the storages dataset.
- q: How do I get a percentage full?
  a: Divide the day's volume by the full storage volume in the companion storages dataset, joining on the
    station number. The Bureau publishes no percentage itself, and this site derives nothing, so the figure is
    yours to work out. A water utility's own page may differ by a point because it may quote an 8 am reading
    against a different capacity.
- q: What do the quality codes mean?
  a: They are the Bureau's own codes for how a value was checked, from 10 for the best quality through 90 and
    110 to 140 and above for estimated or unchecked values, as documented on the Water Data Online site. The
    codes are kept as published.
- q: Why the Bureau rather than each water utility?
  a: The utilities report their storages to the Bureau under the Water Regulations, and the Bureau publishes
    them under CC BY 3.0 AU. Most utilities' own pages carry no open licence, or challenge automated
    requests, so the Bureau's feed is the one licensed national source. Melbourne Water also publishes its
    ten storages through the Victorian open data portal under CC BY 4.0.
summary: The daily mean volume held in about 540 Australian dams and reservoirs, every day since records
  began, from the Bureau of Meteorology's Water Data Online. About 6.5 million rows, updated weekly.
description: Daily storage volumes for every Australian storage that reports to the Bureau of Meteorology's
  Water Data Online, one row per storage and day, with the validated daily mean volume in megalitres and the
  Bureau's quality code. The series is the Bureau's DMQaQc.Merged.DailyMean.24HR time series of the Storage
  Volume parameter, read whole for every station. Records run from the 1960s for the large dams, and the
  storage's owner, state, coordinates and full storage volume are in the companion dataset of Australian
  water storages.
