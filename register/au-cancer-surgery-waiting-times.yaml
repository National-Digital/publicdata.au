faq:
- q: What is in each row?
  a: One public hospital, one financial year and one type of cancer, which is bowel, breast or lung cancer. It
    gives the number of elective surgeries for the malignant cancer, the median days waited, the peer group's
    average, and the shares of patients who received surgery within 30 days and within 45 days.
- q: Why are there only two years and no state totals?
  a: The Institute publishes these measures for 2011-12 and 2012-13 only. It reports them for each hospital
    and its peer group, and it publishes no figure for a Local Hospital Network, a state or the nation.
- q: What do the blanks mean?
  a: The Institute's explanatory notes define two codes. A dash means "There were no patients reported for
    this indicator in this time period." `NP` means "Reported data did not meet the criteria to calculate
    this indicator." The notes do not define `<5` or `10–30`, which appear only in the number of surgeries,
    or `>=90%`, which appears only in the shares within 30 and 45 days. Each of these cells is null here,
    and the row's `markers` column holds the code the Institute wrote, such as `{"surgeries":"10–30"}`. A
    `<5`, `10–30`, `>=90%` or `NP` cell is also named in the `suppressed` column. A cell the Institute left
    empty has no marker. The shares are fractions, so 0.85 means 85 per cent.
- q: How does this join to the hospital list?
  a: Each row names its hospital as the Institute's list of hospitals and networks in this collection names
    it, so the two join on the name and the reporting unit type, which give one unit each. The code is on the
    hospital list.
summary: Median waiting times for surgery for malignant bowel, breast and lung cancer, and the shares treated
  within 30 and 45 days, for each public hospital in 2011-12 and 2012-13, from AIHW MyHospitals.
description: The cancer surgery waiting times data extract from the AIHW MyHospitals Data API. Each row is one
  hospital, financial year and cancer type, with the number of surgeries, the median waiting time in days, the
  peer group average and the percentages of patients who received surgery within 30 days and within 45 days.
