markers:
  <5: The Institute's notes do not define this code. It appears only in the number of presentations.
  NP: Reported data did not meet the criteria to calculate this indicator.
  NP†: Results could not be accurately calculated as more than 10% of presentations had missing or invalid
    time data.
  '-': There were no patients reported for this indicator in this time period.
  Not peered: The Institute's notes do not define this code. It appears in place of a peer group figure.
