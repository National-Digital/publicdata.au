faq:
- q: What is in each row?
  a: One public hospital, Local Hospital Network, state or the nation, one financial year from 2011-12 and
    one patient group. It gives the number of emergency presentations and the share of patients who left
    the emergency department within four hours of arriving, beside the average for the hospital's peer
    group.
- q: Which patient groups are there?
  a: The Institute gives all patients, patients admitted from the emergency department to the same hospital,
    patients not admitted, and each of the five triage categories. The share is a fraction, so 0.8 means
    80 per cent.
- q: What do the blanks mean?
  a: The Institute writes `<5` for a count under five, `NP` where the data did not meet its criteria to
    calculate the figure and `NP†` where more than 10 per cent of presentations had missing or invalid time
    data. Those cells are null here with a suppressed flag. A dash, meaning no patients were reported, and
    Not peered are null. The markers column keeps each code. The Institute's file also marks with an
    asterisk the figures to interpret with caution, in a column with no heading, which is not carried here.
summary: The share of emergency department patients who left within four hours of arriving, for each public
  hospital, network and state each year since 2011-12, from AIHW MyHospitals.
description: The Time in ED - within 4 hrs sheet of the MyHospitals emergency department data extract from
  the AIHW MyHospitals Data API. Each row is one reporting unit, financial year and patient group, with the
  number of presentations, the percentage of patients who departed within four hours and the peer group
  average.
