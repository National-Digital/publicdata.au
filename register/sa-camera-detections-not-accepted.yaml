faq:
- q: What is in each row?
  a: One camera detection that did not result in an offence being issued, with the date and time, the publisher's
    code and reason, the camera's location code and description, the vehicle, its speed and the limit, and the
    camera category.
- q: What are the reasons?
  a: The publisher's own codes, such as an emergency vehicle within its tolerance or a plate that is not on file.
    Each code comes with its description.
- q: Which period does the table cover?
  a: The financial year of the newest report, 2026-27 at the first version, which the publisher replaces as the
    year goes on. Each new file becomes a version here.
summary: Every detection by a South Australian safety camera in the newest financial year that did not become an
  offence, with the reason the publisher gives.
description: The Camera Not Accept Report from South Australia Police's Expiation Notice Branch. Each row is one
  detection by a fixed or mobile camera that was not accepted as an offence, with the incident date and time, the
  not-accept code and description, the date the record was created, the camera location, the vehicle, the speed
  and limit, and the camera category.
