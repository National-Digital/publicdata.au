faq:
- q: What is the median for?
  a: The median sale price of houses sold in a suburb or town in a calendar year, from the Valuer-General's
    record of sales, as published in the Victorian Property Sales Report. Each row is one locality and
    year. Units and vacant land have their own reports and are not here.
- q: Why does the latest year change?
  a: The publisher releases its time series each year, and each version covers the eleven calendar
    years to the last full year. The report also shows a preliminary median for the current year and the
    change over one and ten years; those columns are derived or not final and are not republished. Earlier
    versions here keep the earlier windows.
- q: What do the null medians mean?
  a: The publisher writes `NA` or a dash where too few sales were recorded in a locality to give a median.
    Both are kept as null.
summary: The median sale price of houses in every Victorian suburb and town for each of the last eleven calendar
  years, from the Valuer-General's sales record. About 800 localities, updated yearly.
description: Median house prices by suburb from the Victorian Property Sales Report time series, one row
  per locality and calendar year for the eleven years the release covers. The medians are of houses sold
  in the year as recorded by the Valuer-General Victoria and published by the Department of Transport
  and Planning. The report's preliminary current year figure and its one and ten year change columns are
  not republished.
