collection_description: |
  Access Canberra publishes the traffic, camera and parking infringements it issues in the ACT, with the places its road safety cameras stand and the visits its mobile speed cameras make.

  The collection holds six tables. Traffic and camera offences since July 2021 and parking offences since July 2021 are daily counts and penalty totals by offence and location. Traffic camera offences from July 2010 to June 2021 are the earlier monthly series. Mobile speed camera visits record each stay of a mobile camera with the vehicles it checked. The two location tables give the coordinates of every enforcement camera and every mobile phone and seatbelt detection camera site, which the offence tables name by location code.
