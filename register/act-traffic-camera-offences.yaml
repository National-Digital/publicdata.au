faq:
- q: What is in each row?
  a: One offence on one day, at one camera location where there is one, for one registration state and
    client type, with the number of infringements and the sum of their penalties in dollars.
- q: What do the infringement types mean?
  a: They are the publisher's codes. `TRF_RLC` covers red light and fixed speed cameras, `TRF_CIN` mobile
    speed cameras, `TRF_MDDC` mobile phone detection cameras, `TRF_DSB` and `TRF_PSB` driver and passenger
    seatbelt offences, `TRF_P2P` point to point cameras, `TRF_TIN` infringements issued by police and other
    officers, and `UNRGSTRD` and `UNINSRD` unregistered and uninsured vehicles.
    The publisher notes that `TRF_TIN` rows carry no camera location code.
- q: How do I map the offences?
  a: The camera location code matches the location codes in the ACT traffic camera locations and the
    mobile distraction camera locations tables in this collection. The publisher says some cleaning may
    be needed for the codes to match.
summary: Traffic and camera infringements issued in the ACT since July 2021, one row per offence, day,
  camera location, registration state and client type, with the count and the penalty total.
description: Daily counts of the traffic and camera offences Access Canberra records in the ACT from 1
  July 2021. Each row carries the offence date, the state of the vehicle's registration, whether the
  client is a person or an organisation, the infringement type, the camera location code, the offence
  description, the number of infringements and the sum of their penalty amounts.
