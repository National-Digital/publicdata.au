faq:
- q: What is in each row?
  a: One roadside amenity on a Queensland state road, such as a rest area, a heavy vehicle rest area
    or a service centre. Each row has the department's amenity identifier, its name and type, the
    local government area, its longitude and latitude in GDA2020, and the facilities the department
    records there, such as toilets, water, showers, tables, shelter, lighting and mobile reception.
- q: Does it cover council and national park rest areas?
  a: The layer holds the amenities the department records beside the state-controlled road network, and the
    local government area column names the council each one sits in. Rest areas on council roads and in parks
    are listed by their own managers.
- q: Can I camp at these sites?
  a: The layer records where an amenity is and what it offers. It states no rule about how long a person
    may stay. Signs at each site and the managing authority set those rules.
summary: The roadside amenities on Queensland's state roads, with each site's type, location and facilities,
  from the Department of Transport and Main Roads.
description: The Roadside amenities layer of the Department of Transport and Main Roads, which shows the position
  of roadside amenities, facilities and effluent dump sites in Queensland as part of the road safety management
  program. Each row is one amenity with its identifier, name, type, local government area, the longitude and
  latitude the department gives in GDA2020, and its recorded facilities. The layer is read from the Queensland
  Government's State Road Information map service.
