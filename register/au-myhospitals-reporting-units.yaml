faq:
- q: What is in each row?
  a: One reporting unit of the MyHospitals Data API, which is a hospital, a Local Hospital Network, a Primary
    Health Network, a peer group, a state or the nation. Each row has the unit's code, its current name, its
    type, the other names the Institute lists for it, and whether it is private and whether it is closed.
- q: How are the alternative names written?
  a: A unit with more than one alternative name has them in one cell, separated by ` | `, in the order the
    Institute lists them. A unit with none has a blank cell. An alternative name may be a short name or an
    earlier name.
- q: Where are the Local Hospital Network codes?
  a: The reporting unit mappings in this collection list the Local Hospital Network, Primary Health Network
    and state each unit maps to, by code. The hospital list in this collection has each unit's coordinates.
    The Institute has not endorsed this site.
