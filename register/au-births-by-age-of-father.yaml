faq:
- q: What is in each row?
  a: The number of births registered in Australia in one calendar year to fathers of one age, for one
    nuptiality group. Ages run in single years from 15 and under, with the ABS's rows for the oldest ages,
    all ages and age not stated.
- q: What does nuptiality mean?
  a: A nuptial birth is one where the parents were married to each other when the birth was registered.
    An ex-nuptial birth appears here only when paternity was acknowledged, since the father's age is
    otherwise unknown. The Total group counts both as the ABS publishes it.
- q: Is the year the year of birth?
  a: It is the year the birth was registered. Most births are registered in the year they occur, and a
    late registration is counted in the year it was made.
summary: Births registered in Australia each year since 1975 by single year of the father's age and by
  whether the parents were married, from the ABS. Updated yearly.
description: The ABS Data Explorer table BIRTHS_AGE_FATHER, registered births, nuptiality by age of father,
  1975 onwards. Each row is one year, one age of father and one nuptiality group, with the number of births
  registered. The ABS codes are kept beside the names it gives them.
