faq:
- q: What is in each row?
  a: One station, year, direction, vehicle class and period of the week, such as weekdays or the morning (AM) peak, with
    the traffic count Transport for NSW reports for it and its flags for a partial year, data availability,
    reliability and quality.
- q: How is the traffic count formed?
  a: The count is the figure Transport for NSW reports for the station, year, direction, vehicle class and
    period named. Its documentation on the dataset page explains how counts are built. Note the partial year
    flag and the quality indicators before comparing stations or years.
- q: Where is each station?
  a: Join on the station key to the station table in this collection, which has the road, suburb and coordinates.
summary: The yearly traffic count at each Transport for NSW counting station since 2006, by direction, vehicle
  class and period of the week.
description: The Road Traffic Counts Yearly Summary table from Transport for NSW's NSW Roads Traffic Volume
  Counts dataset, as the publisher exports it from its traffic volume API. Each row is one station, year, traffic
  and cardinal direction, vehicle classification and period, with the traffic count, a partial year flag and
  the publisher's availability, reliability and quality indicators. The publisher's row number is kept as the
  key.
