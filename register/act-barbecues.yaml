faq:
- q: What is in each row?
  a: One public barbecue owned or managed by the ACT Government, with its asset identifier and name, the
    park or place it is in, whether it is electric, gas or wood, its hotplates, bench and door type,
    whether there is a tap, the suburb and address, the owner and maintainer, and its coordinates.
- q: Does it list every barbecue in Canberra?
  a: No. The publisher lists the barbecues that City Services or another part of Transport Canberra and City
    Services owns or manages. Barbecues run privately, by other directorates or by the Federal Government
    may not be included.
- q: Where is the publisher's file?
  a: The portal serves the layer as a table with each point as text. This site reads the portal's GeoJSON
    export of the same rows, ordered by the portal's row identifier, and keeps that file as the source of
    every version.
summary: Every public barbecue the ACT Government owns or manages, one row per barbecue with its park,
  type, hotplates, suburb and coordinates.
description: The public barbecues in the ACT that Transport Canberra and City Services owns or manages,
  about half of them electric and most of the rest wood-fired. Each row carries the asset type
  and subtype, the asset identifier and name, the location, make, hotplate combination and material, unit
  numbers, whether there is a tap, the bench and door types, the suburb, address, owner and maintainer, the
  publisher's global identifier and the point's longitude and latitude.
