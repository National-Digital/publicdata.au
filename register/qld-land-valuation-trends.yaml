slug: qld-land-valuation-trends
title: Change in land values by council area, Queensland, 2010 onwards
status: live
topics:
- housing
order: 251
collection: qld-land-valuation-trends
collection_title: Historical trends in land valuations, Queensland
collection_search_title: Queensland land valuation trends by council (Valuer-General)
collection_description: 'The Queensland Valuer-General issues statutory land valuations each year for the local
  government areas due for one. The department publishes the overall change in land values in each area at
  each valuation as two tables, one for 2002 to 2009 and one from 2010.


  The tables are split at the 2008 council amalgamations. The earlier table names the pre-amalgamation councils
  with the council each became part of. The publisher notes that Douglas, Livingstone, Mareeba and Noosa de-amalgamated
  from Cairns, Rockhampton, Tablelands and Sunshine Coast from 2014.'
temporal_start: '2010-01-01'
search_title: Queensland land valuation change by council area, 2010 onwards
also_known_as:
- Queensland statutory land valuation trends
- QLD land value change by LGA
- Valuer-General annual valuation results Queensland
keywords:
- land valuation
- land values
- statutory valuation
- Valuer-General
- local government area
- Queensland
faq:
- q: What does each figure mean?
  a: Each figure is the overall percentage change in statutory land values in a local government area at that
    year's annual valuation, compared with its previous valuation. A council area is not valued every year,
    and the publisher writes `NV` for a year it was not valued. `NV` is kept as a null value here.
- q: What are the total rows?
  a: The publisher puts rows counting the local government areas, and those valued, at the top of the table.
    They are kept as published.
summary: The overall percentage change in statutory land values in each Queensland local government area at
  each annual valuation from 2010.
description: 'One row per local government area, with the overall percentage change in statutory land values
  at its annual valuation for each year from 2010, beside the area''s code. Each year is one column, as the
  publisher lays it out. A year in which the area was not valued is null. Two rows at the top count the areas
  and those valued each year.


  The publisher adds a column when a new valuation is issued. A new year column is reported and held until
  the register names it.'
