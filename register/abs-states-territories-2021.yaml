faq:
- q: What is in each row?
  a: One of the states and territories as the ABS's Australian Statistical Geography Standard, Edition 3 (2021),
    defines them, with its code, name, area and the other columns the ABS publishes, and its shape in the GeoParquet,
    GeoJSON, GeoPackage and PMTiles files. The CSV, Excel and other table files hold the columns without the shape.
- q: What coordinate system are the shapes in?
  a: GDA2020 (EPSG:7844), the file the ABS publishes in that datum. GDA2020 differs from WGS84 by well under a metre,
    so web maps can use it as it is.
- q: What is Other Territories?
  a: The ABS groups Jervis Bay Territory, Christmas Island, the Cocos (Keeling) Islands and Norfolk Island as Other
    Territories. Any row the ABS adds without a shape is kept, with a null geometry, so every ABS code is in the table.
summary: The states and territories of Australia as the ABS's Australian Statistical Geography Standard, Edition 3
  (2021), defines them, one shape each, in GDA2020.
description: The ABS digital boundary file STE_2021_AUST_SHP_GDA2020.zip, from the Australian Statistical Geography
  Standard (ASGS) Edition 3. Each row is one state or territory with the columns the ABS publishes. A row the ABS
  adds without a shape is kept, with a null geometry, so every ABS code is in the table.
