faq:
- q: What is in each row?
  a: One measure for one council area, one month from July 2025 to June 2026, one type of work and one
    type of building. The measures are the number of dwelling units approved, the number of building jobs
    valued at $50,000 or more, and the value of building jobs in thousands of dollars. All rows are for
    the private and public sectors together.
- q: Why are some values blank?
  a: The ABS marks a figure it does not publish for a council area, usually to protect confidentiality,
    with observation status n. The value is blank and the status column carries the ABS's code and
    meaning. Those figures are still counted in the ABS's state and national totals.
- q: Which council boundaries are used?
  a: The Local Government Areas of the ABS's 2025 edition, the same edition as the council boundaries
    dataset here. The ABS publishes each financial year as its own table on that year's boundaries, so
    earlier and later years are separate tables.
- q: Which building types are included?
  a: Total residential and its parts (houses, townhouses and other semi-detached dwellings, apartments
    and other residential), the commercial, industrial and other non-residential totals, total
    non-residential and the total of all building. The finer non-residential types the ABS publishes are
    left out of this table.
summary: Dwellings and building jobs approved each month in 2025-26 in every Australian council area, by
  type of work and type of building, with their value, from the ABS.
description: The ABS Data Explorer table BA_LGA2025, building approvals by Local Government Area (LGA 2025),
  read for the total of both sectors, Local Government Areas only, and the residential types with the
  non-residential totals. Each row is one month, council area, measure, type of work and type of building,
  with its value, unit and the ABS observation status. The ABS codes are kept beside the names it gives
  them.
