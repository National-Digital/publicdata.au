faq:
- q: What is in each row?
  a: One death registered in the ACT, with the registration number, the surname and given names of the
    person who died, the date of death, and the surnames and given names of the father and mother where
    the registry recorded them.
- q: Why are recent deaths missing?
  a: The publisher's index holds only deaths registered in the ACT more than 30 years ago. Later deaths
    are added as they pass that age.
- q: Is this a death certificate?
  a: No. It is an index with limited details. A certificate is ordered from the ACT Registry of Births,
    Deaths and Marriages.
summary: An index of deaths registered in the ACT more than 30 years ago, from 1930, one row per death
  with the names of the person and their parents and the date of death.
description: The historic death index Access Canberra keeps for deaths registered in the ACT more than
  30 years ago. Each row carries the registration number, the surname and given names of the person who
  died, the date of death, and the father's and mother's surnames and given names where they were
  recorded. Babies who died before being named are shown as `UNNAMED`.
