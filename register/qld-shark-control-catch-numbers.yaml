faq:
- q: What is in each row?
  a: Each row is a count of animals of one species caught on one kind of gear at one beach in one month, with
    whether they were alive or dead, their fate and the reason, and the marine park the beach lies in.
- q: Does it include animals other than sharks?
  a: Yes. The species group column separates sharks from turtles, marine mammals and other animals such as
    rays and fish, which the publisher includes in the same table.
- q: Why are some scientific names blank?
  a: The publisher writes `NULL` where an animal was not identified to species, such as an unknown shark. Those
    cells are null here.
summary: The number of sharks and other animals caught by Queensland's shark nets and drumlines, by month,
  beach, gear and species, since 1996.
description: 'Counts of animals caught by the Queensland Shark Control Program''s nets and drumlines, from
  1996 to the latest month the publisher has added. Each row is one year and month, area, beach, gear type
  and species, with the species group, the Codes for Australian Aquatic Biota (CAAB) code, the common and scientific
  names, whether the animals were alive or deceased, their fate and its reason, and the number caught.


  The cells the publisher writes as `NULL` are null here.

  '
