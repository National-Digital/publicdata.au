collection_search_title: Queensland shark net and drumline catch data (Shark Control Program)
collection_description: 'The Queensland Shark Control Program sets nets and drumlines off popular beaches from
  the Gold Coast to Cairns. The Department of Primary Industries publishes what the gear catches, sharks and
  the other animals caught with them, such as turtles, rays and dolphins.


  This collection holds three tables. The catch numbers table counts animals by month, beach and species since
  1996. The biological table has one row per animal with its length and sex. The Great Barrier Reef table lists
  each animal caught in the marine park with its date, for the current financial year.

  '
temporal_start: '1996-01-01'
