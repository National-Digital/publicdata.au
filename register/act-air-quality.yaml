faq:
- q: What is in each row?
  a: One hour at one of the ACT's air quality monitoring stations (Civic, Florey and Monash), with the
    pollutant concentrations measured there and the Air Quality Index the publisher works out for each
    pollutant and for the site.
- q: Has the data been checked?
  a: The publisher says the readings are unverified. They may have had no or only preliminary quality
    assurance, and may change after calibration changes, power failures or instrument failures.
- q: Why are some pollutants blank at some stations?
  a: Not every station measures every pollutant. A blank cell is a reading the station did not make or
    report for that hour.
summary: Hourly readings from the ACT's air quality monitoring stations at Civic, Florey and Monash since
  2011, with particles, ozone, nitrogen dioxide, carbon monoxide and the Air Quality Index.
description: Hourly ambient air quality readings from the ACT Government's monitoring stations at Civic
  and Monash from January 2011 and Florey from February 2014. Each row carries the station name, its
  position as text, the date and time, the concentrations of nitrogen dioxide, ozone over one, four and
  eight hours, carbon monoxide, PM10 and PM2.5 over one hour and their rolling averages, the Air Quality
  Index for each pollutant and the site's overall index.
