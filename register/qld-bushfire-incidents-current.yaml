  MIN_Details: Added to the feed on 23 October 2026 as free-text dispatch notes, which can hold radio
    channels, permit numbers and crew shorthand. The publisher's description of the dataset does not include
    them.
  Location_Name: Added to the feed on 23 October 2026. Versions before that date do not carry it, and a declared
    column must be present on every read, so it is held.
  Cross_Street: Added to the feed on 23 October 2026. Versions before that date do not carry it, and a declared
    column must be present on every read, so it is held.
  LGA: Added to the feed on 23 October 2026 and empty on every item in the first read.
  Command_Channel: A radio channel for the crews at the fire. It is operational detail that the publisher's
    description of the dataset does not include, and it was empty on every item in the first read.
  Primary_TAC_Channel: A radio channel for the crews at the fire. It is operational detail that the publisher's
    description of the dataset does not include, and it was empty on every item in the first read.
  SubType: Added to the feed on 23 October 2026. It repeats the type that GroupedType gives, as VEGETATION
    or PERMITTED BURN.
  MajorType: Added to the feed on 23 October 2026. It was FIRE on every item in the first read.
  IsPubliclyShared: Added to the feed on 23 October 2026. It marks the items the publisher releases and was
    YES on every item in the first read.
  (longitude): The point geometry of a feature, which repeats the Longitude property; polygon warning
