faq:
- q: What is in each row?
  a: One current vegetation fire, permitted burn or fire warning in the Queensland Fire Department feed
    at the time of the daily read, with its id, title, warning level, call to action, warning text, area,
    the point the publisher gives for it, its type and the times it was issued, published and expires.
- q: Does the point show where the fire is?
  a: No. The publisher says each point marks the general area of the fire. The point does not follow the
    fire's current location or spread. Warnings also carry a drawn warning area in the feed, which is
    not kept in this table.
- q: How often does it change?
  a: The publisher updates the feed every 30 minutes. This site reads it once a day and keeps a version
    for each day it changes, so the archive is a daily snapshot and fires that start and end between reads
    are not in it.
- q: Why are some columns missing?
  a: Some details, such as vehicles on scene and locality, appear only on incidents, and others, such
    as what to do, only on warnings. On a day with none of one kind those columns are absent, so this
    table keeps the columns every item carries. The publisher added eleven columns to the feed on 23 October
    2026, such as the incident type and nearest cross street. The earlier versions do not carry them, so
    this table does not include them.
summary: A daily snapshot of every current vegetation fire, permitted burn and fire warning in the Queensland
  Fire Department feed, with title, warning level, text, area, point and times.
description: The Queensland Fire Department current bushfire incidents feed, read once a day, one row
  per item in the feed at that time. Each row has the item id, title, warning level and its sort order,
  call to action, warning text and header, warning area, latitude and longitude, grouped type, event type
  and the times the item was issued, published and expires. Use the publisher's own warnings for safety
  decisions.
