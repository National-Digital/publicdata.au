collection_description: |
  Victorian councils register the dogs and cats kept in their area, and several have published their register as a list of animals without owners' names or addresses. Each table here is one council's file as it published it, with its own columns.

  The City of Greater Dandenong lists registered dogs by suburb with breed, colour and sex. Golden Plains Shire lists dogs and cats with breed, colour, desexing, microchip and registration class. Southern Grampians Shire lists dogs and cats by town and ABS mesh block.
