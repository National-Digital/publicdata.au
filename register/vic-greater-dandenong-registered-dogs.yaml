faq:
- q: What does each row hold?
  a: One dog on the City of Greater Dandenong's register when the file was published, with its suburb,
    postcode, breed, colour and sex. Owners and addresses are not in the file.
- q: What do the breed and colour codes mean?
  a: The council writes breeds and colours as short codes from its register, such as `MALTX` for a Maltese
    cross and `BLAWHI` for black and white. They are kept as published, since the file gives no key.
- q: Is it current?
  a: The portal dates the file January 2021. It is a single snapshot of the register and has not been updated since.
summary: Each of about 7,500 dogs on the City of Greater Dandenong's register, with suburb, postcode, breed
  code, colour code and sex.
description: The City of Greater Dandenong's list of registered dogs as published on data.gov.au, one row
  per dog with its locality, postcode, animal type, breed and colour as the council's register codes them,
  and sex. The council notes that it makes no guarantee about the accuracy of the data.
