faq:
- q: What is in each row?
  a: One weekly sample at one swimming site during the 2018-19 season, with the site code and name, the
    intestinal enterococci result per 100 millilitres, whether it met the guideline, the algae result and
    final compliance where recorded, any comment, and the site's coordinates.
- q: What do `NS` and `NR` mean in the result?
  a: They are the publisher's codes for a site not sampled or a result not recorded that week. A result
    above or below the laboratory's range is written with a greater than or less than sign. The result is
    kept as text so these survive. The publisher marks some unsampled weeks as meeting the guideline and
    some as not, so leave them out before counting results.
- q: Are later seasons here?
  a: No. The publisher's tables for the 2021-22 season onwards state no licence on the portal, so they are
    not republished here.
summary: Weekly intestinal enterococci results at the ACT's recreational swimming sites in the 2018-19
  season, one row per site and sample with the result and whether it met the guideline. About 1,000 rows.
description: The results of ACT Health's recreational water quality monitoring at 17 swimming sites on Lake
  Ginninderra, Lake Tuggeranong, the Molonglo at its water ski ramp, Paddys River and the Murrumbidgee for
  the 2018-19 swimming season. Each row carries the publisher's row identifier, the sample date, the site
  code and name, the intestinal enterococci result, whether it complied, the algae result, the final
  compliance, any comment and the point's longitude and latitude.
