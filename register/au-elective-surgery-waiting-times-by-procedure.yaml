faq:
- q: What is in each row?
  a: One public hospital, Local Hospital Network, state or the nation, one financial year from 2011-12 and
    one intended procedure. It gives the number of elective surgeries, the median days waited, the share of
    patients who waited more than 365 days, and the peer group's median and average beside them.
- q: Why are there more procedures from 2016-17?
  a: In 2016-17 the Institute replaced its list of 15 indicator procedures with a list of 152 intended
    procedures. Years before 2016-17 hold only the earlier list, so a comparison over time should allow for
    the change.
- q: What do the blanks mean?
  a: The Institute's explanatory notes define two codes. A dash means "There were no patients reported for
    this indicator in this time period." `NP` means "Reported data did not meet the criteria to calculate
    this indicator." The notes do not define `<5`, which appears only in the number of surgeries, or Not
    peered, which appears only in the peer group figures. Each of these cells is null here, and the row's
    `markers` column holds the code the Institute wrote, such as `{"median_wait_days":"-"}`. A `<5` or `NP`
    cell is also named in the `suppressed` column. A cell the Institute left empty has no marker. Peer group results appear only where
    more than two hospitals in the peer group performed the procedure. The share who waited more than 365 days
    is a fraction, so 0.05 means 5 per cent.
- q: How does this join to the hospital list?
  a: Each row names its reporting unit as the Institute's list of hospitals and networks in this collection
    names it, so the two join on the name and the reporting unit type, which give one unit each. The code
    is on the hospital list.
summary: Median waiting times for elective surgery and the share who waited more than a year, for each
  public hospital and network by intended procedure each year since 2011-12, from AIHW MyHospitals.
description: The Intended procedure sheet of the MyHospitals elective surgery waiting times data extract from
  the AIHW MyHospitals Data API. Each row is one reporting unit, financial year and intended procedure, with
  the number of surgeries, the median waiting time in days, the percentage of patients who waited more than
  365 days and the peer group's median and average.
source:
  adapter: file
  url: https://myhospitalsapi.aihw.gov.au/api/v1/measure-downloads/myh-es
  format: xlsx
  sheet: Intended procedure
  header_row: 15
  cadence: several times a year
  as_at_regex: 'Data as of:\s*(?:[A-Za-z]+,\s*)?([A-Za-z]+ \d{1,2}, \d{4})'
suppression:
- <5
- NP
markers:
  <5: The Institute's notes do not define this code. It appears only in the number of surgeries.
  NP: Reported data did not meet the criteria to calculate this indicator.
  '-': There were no patients reported for this indicator in this time period.
  Not peered: The Institute's notes do not define this code. They say "Peer group results by intended
    procedures are only presented if there were more than two hospitals that performed the surgery in
    the peer group."
