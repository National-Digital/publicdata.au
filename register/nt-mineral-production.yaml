faq:
- q: What is in each row?
  a: One commodity in one financial year, with its unit and the quantity produced, the quantity sold
    and the amount paid for the quantity sold in Australian dollars, from the production returns that
    operators lodge under the Territory's mining legislation. The group is the publisher's heading,
    such as Metallic Minerals.
- q: Which licence applies?
  a: The portal states Creative Commons Attribution without a version. The Northern Territory Department
    of Corporate and Digital Development confirmed in writing on 2 October 2026 that, under the Northern
    Territory Government's Creative Commons Policy, this series is released under CC BY 4.0.
- q: What are the rows that end in Value?
  a: The publisher's totals. Metallic Minerals Value, Gemstones Value and Non-Metallic Minerals Value
    total their groups, and Total Minerals Value totals every group; the workbooks place it last, so it
    sits under Energy Minerals. They carry only an amount, so a sum over every row counts each dollar
    twice.
- q: What does the note number mean?
  a: The number of the explanatory note the publisher attached to the commodity that year. The notes
    are in each year's workbook. They say, among other things, that alumina and alumina hydrate are
    derived from bauxite, that gold excludes the gold in gold dore, and that some non-metallic values are
    estimated from average prices. The same commodity can carry a different number in another year.
- q: Can the years be compared with earlier figures?
  a: Not directly. On 1 July 2009 the Territory began to value production as the amount actually paid
    for the quantity sold, where it had estimated the value of the quantity produced. This series starts
    after that change, in 2010-11.
- q: Why does the series stop in 2018-19?
  a: The workbooks for 2010-11 to 2018-19 are the ones the portal holds under this licence. The files
    are kept on a departmental host that turns automated clients away, so they were downloaded by a
    person, and the weekly fetch checks the portal's records for any change.
summary: The quantity produced, quantity sold and value of every mineral commodity mined in the Northern
  Territory, from bauxite and manganese to gold, uranium oxide and gravel, for each financial year from
  2010-11 to 2018-19. Closed series.
description: Annual mineral production statistics for the Northern Territory, from the production returns
  operators lodge under the Territory's mining legislation. Each row is one commodity in one financial
  year, under the publisher's group (Metallic Minerals, Gemstones, Non-Metallic Minerals or Energy
  Minerals), with its unit of quantity, quantity produced, quantity sold and the amount paid for the
  quantity sold. The nine annual workbooks from 2010-11 to 2018-19 are read as one table.
