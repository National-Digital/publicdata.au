faq:
- q: What is in each row?
  a: The ABS's estimate of the people usually resident in one council area at 30 June of one year from 2001,
    for one sex and one five-year age group. The ABS's rows for both sexes together and for all ages are kept,
    so a council's total population is the row with sex code `3` and age code `TOT`.
- q: Which council boundaries are used?
  a: The Local Government Areas of the ABS's 2025 edition, the same edition as the council boundaries dataset
    here. The ABS has re-estimated every year from 2001 on those boundaries, so a council's figures for earlier
    years describe the area it covers in 2025. A table on another edition's boundaries is a separate dataset,
    because the ABS changes some codes between editions.
- q: Are the figures final?
  a: The ABS revises recent years when later census and migration data arrive. Each yearly release replaces the
    figures for the years it revises, and this site keeps every release as a dated version.
- q: What do the codes beginning with the state digit and ending in 99 mean?
  a: The ABS gives each state rows for its unincorporated area, for people with no usual address, and for
    people offshore or on ships. They are kept as the ABS publishes them and are not council areas.
summary: The estimated resident population of every Australian council area at 30 June each year since 2001, by
  sex and five-year age group, on the ABS's 2025 council boundaries. Updated yearly.
description: The ABS Data Explorer table ABS_ANNUAL_ERP_LGA2025, estimated resident population by Local Government
  Area (LGA 2025), age and sex, 2001 to 2025, read for Local Government Areas only. Each row is one year, council
  area, sex and age group, with the estimated number of residents at 30 June and the ABS observation status. The
  ABS codes are kept beside the names it gives them.
