faq:
- q: What does each row hold?
  a: One water sample taken at one beach, with the beach's site number and name, the date and time it was
    taken, the enterococci count in organisms per 100 mL, a qualifier and the sample type, such as Routine.
- q: What does the qualifier mean?
  a: An equals sign means the count is as measured. A less than or greater than sign means the true count
    is below or above the figure given, which is the limit the laboratory test can report.
- q: Where are the beaches?
  a: The beaches and their coordinates are in the companion table of Beach Report sites, which joins on
    the site number.
- q: Why does one beach appear under more than one name?
  a: The publisher renamed some sites and misspelt others, so site 99170 is `Frankston LSC`, Frankston Life
    Saving Club and Frankston Surf Life Saving Club, and site 99700 is also Wiliamstown. Group by the site
    number to count a beach across the whole record.
summary: Every enterococci water sample EPA Victoria has taken at Port Phillip Bay beaches since December
  2013, about 9,700 results, with beach, time and count.
description: EPA Victoria's Beach Report sampling results, one row per water sample from December 2013.
  The samples are taken at 36 Port Phillip Bay beaches between September and May and tested for
  enterococci, the indicator EPA uses for faecal contamination of recreational water. Each row has the
  beach, the sample time, the count per 100 mL with its qualifier and the sample type.
