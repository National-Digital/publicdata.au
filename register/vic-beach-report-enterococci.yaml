collection_description: |
  Each summer, from September to May, EPA Victoria samples the water at 36 Port Phillip Bay beaches and tests it for enterococci, a bacterium found in faeces. The results feed its Beach Report, and the full record of samples since December 2013 is released as one workbook.

  Two tables are here. One holds every sample result with its beach and time, and the other the beaches themselves with their water body and coordinates.
