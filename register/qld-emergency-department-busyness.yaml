faq:
- q: What is in each row?
  a: One emergency department or clinic, one day of the week and one time band, with the value the publisher
    uses to chart how busy that facility usually is at that time.
- q: What does the value measure?
  a: The publisher does not document it in the data. It is the figure behind the busyness chart on its
    wait time pages and is kept as published. Time bands are numbered 0 to 23.
summary: How busy each Queensland public emergency department usually is by day of the week and time band,
