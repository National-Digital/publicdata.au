collection_description: |
  Crash data from Queensland roads is the dataset the Department of Transport and Main Roads (TMR) publishes as its road crash statistics. It covers every crash reported to police on a Queensland road since 1 January 2001 in which a person was killed or injured, a vehicle was towed away or property damage met the reporting threshold. Cars, trucks, buses, motorcycles, bicycles and pedestrians are all in it.

  The release is six tables. Road crash locations has one row per crash with coordinates. The other five are counts by year and police region: casualties, driver demographics, seatbelt and helmet use, vehicle types and contributing factors such as drink driving, speed and fatigue.
faq:
- q: Does it include every car accident in Queensland?
  a: No. It holds the crashes reported to police that met the publisher's criteria, so a minor collision
    that nobody reported is not here. Property damage only crashes stop after 31 December 2010, and from
    then on a crash needs a casualty or a tow to be included.
- q: Why are the most recent months lower than expected?
  a: The publisher treats the last 12 months of each release as preliminary, because a police
    investigation can take up to a year to finalise. The counts for those months rise in later releases.
- q: Where is the Queensland road toll in this data?
  a: Each crash row carries count_casualty_fatality, and the Road casualties table has fatalities counted
    by year, police region, age group and road user type. The department also publishes a road toll
    separately and updates it more often, so the two can differ for recent months.
summary: Every reported crash on a Queensland road since 1 January 2001, one row per crash, with its coordinates,
  severity, road conditions and casualty and vehicle counts.
description: 'One row per reported road traffic crash in Queensland from 1 January 2001. The publisher
  includes a crash when a person was killed or injured, a vehicle was towed away, or property damage met
  its reporting threshold. Property damage only crashes stop after 31 December 2010. Crashes in the last
  12 months of a release are preliminary because police investigations can take up to a year. Coordinates
  are GDA2020.


  This is the largest of six tables the publisher releases together. The other five are aggregate counts
  by year and police region.'
