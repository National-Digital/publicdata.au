blocked_reason: We asked FuelWatch on 2 October 2026 for permission to republish the historic files.
  On 7 October 2026 FuelWatch declined in writing. It corrects past prices when it finds errors and
  keeps its own download pages as the primary copy. Both histories can be downloaded from FuelWatch,
  and the terminal gate prices are at https://www.fuelwatch.wa.gov.au/industry/historic-terminal-gate-prices.
