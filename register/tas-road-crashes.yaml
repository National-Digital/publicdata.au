faq:
- q: Where is the publisher's file?
  a: There is none. The publisher serves the crashes as an ArcGIS feature layer with no download. This
    site reads every feature of the layer in pages, in the order of the layer's own identifier, and
    keeps them as one GeoJSON file, which is the source file beside every version.
- q: Does it include every crash?
  a: The publisher includes crashes reported by Tasmania Police, and property damage only crashes
    reported by the public. A crash nobody reported is not here.
- q: How often is it updated?
  a: The layer changes as the police crash database changes. This site checks it weekly and adds a
    dated version when the features change.
- q: Why are there crashes before 2009?
  a: The publisher names the layer for crashes since 1 January 2009, and it also holds 56,136 crashes
    dated from January 1998 to December 2008 in the September 2026 version. They are kept as published.
summary: Every crash on a Tasmanian road since 1998 reported by Tasmania Police or the public, one row
  per crash, with its coordinates, date and time, severity, crash movement, speed zone and road surface.
description: One row per crash on a Tasmanian road, from the Crash Data Management database Tasmania
  Police uses. The publisher names the layer for crashes since 1 January 2009 and it also holds crashes
  back to January 1998. Each row carries the crash number, date and time, the crash movement
  description, severity, whether police attended, the road surface, light condition, centre line
  marking, speed zone, a location description and the point coordinates.
