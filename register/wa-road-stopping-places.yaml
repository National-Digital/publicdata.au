faq:
- q: What is in each row?
  a: One stopping place on a Western Australian state road, with its road, the straight line kilometre
    where it sits, its local government area and Main Roads region, its type and name, whether a 24 hour stay
    is allowed, and the facilities recorded there, such as toilets, tables, bins, shelter, shade and lighting.
- q: Can I stay overnight at a stopping place?
  a: The publisher records `Yes`, `No` or `Unknown` for a 24 hour stay at each site, and the column is kept as
    published. Signs at each site and the managing authority set the rules.
- q: Which roads are covered?
  a: The layer shows stopping places and rest areas on all state roads in Western Australia, of three kinds
    the publisher names as parking, short break and long break. Sites on local roads are not included.
summary: The road stopping places and rest areas on Western Australia's state roads, with each site's type,
  24 hour stay rule, location and facilities, from Main Roads Western Australia.
description: The Road Stopping Places layer of Main Roads Western Australia, read from the layer on the publisher's
  own map service. Each row is one stopping place on a state road, with the road and straight line kilometre, the local
  government area and region, the rest area type and name, the 24 hour stay rule, the surface and the facilities
  the publisher records, the publisher's GlobalID for the site, and the point's longitude and latitude.
