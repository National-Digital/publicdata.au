faq:
- q: What is in each row?
  a: One public hospital, Local Hospital Network, state or the nation, one financial year from 2011-12 and
    one patient group. It gives the number of emergency presentations, the median time patients spent in
    the emergency department and the time by which 90 per cent of them had left, beside the peer group
    average of that second figure.
- q: Which patient groups are there?
  a: The Institute gives all patients, patients admitted from the emergency department to the same hospital,
    and patients not admitted.
- q: Why are the times text?
  a: The Institute writes each time in hours and minutes, such as `2 hrs 58 mins`. This site publishes the
    times as the Institute wrote them. For some unpeered hospitals the file gives a peer group average of
    `0 hrs 0 mins`, and that value is kept as written.
- q: What do the blanks mean?
  a: The Institute writes `<5` for a count under five. Those cells are null here with a suppressed flag. In
    the times, `NP` means the data did not meet the Institute's criteria to calculate the figure and `NP†`
    means more than 10 per cent of presentations had missing or invalid time data. Those cells, a dash
    meaning no patients were reported, and Not peered are null. The markers column keeps each code. The
    Institute's file also marks with an asterisk the figures to interpret with caution, in columns with no
    heading, which are not carried here.
summary: The median time patients spent in emergency departments and the time by which 90 per cent had left,
  for each public hospital, network and state each year since 2011-12, from AIHW MyHospitals.
description: The Time in ED sheet of the MyHospitals emergency department data extract from the AIHW
  MyHospitals Data API. Each row is one reporting unit, financial year and patient group, with the number of
  presentations, the median time in the emergency department, the time until 90 per cent of patients
  departed and the peer group average of that time.
