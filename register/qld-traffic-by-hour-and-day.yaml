faq:
- q: What is in each row?
  a: One traffic count site, direction of travel and hour of the day, with the average number of vehicles in
    that hour on each day of the week across 2025, the weekday and weekend averages, the site's road and location,
    and its TMR district and region.
- q: Why is this table for 2025 only?
  a: The publisher adds one workbook for each year, and each workbook names its sheet after its year. This
    entry reads the 2025 workbook. Earlier years are on the portal as separate files.
- q: Why are some day columns blank?
  a: The publisher leaves a day blank where a site has no average for that hour and day. The blank is kept
    as a null.
summary: The average number of vehicles in each hour of each day of the week at every count site on Queensland's
  state-controlled roads in 2025.
description: One row per count site, direction of travel and hour of the day on the Queensland state-declared
  road network for 2025, from the Department of Transport and Main Roads. Each row has the average volume in
  that hour on each day from Monday to Sunday, the weekday and weekend averages, the site's description, road
  section, through distance, segment, coordinates and TMR district and region.
