faq:
- q: What is in each row?
  a: One emergency department or minor injury and illness clinic, by facility code, with the time the
    figures were taken, the number of people waiting, the median wait for all triage categories and for
    categories 4 and 5, the publisher's data status and the delay in hours it states for the figures.
- q: What unit are the median waits in?
  a: The publisher does not state one in the data. Its emergency department wait time pages show waits
    in minutes. A dash means no median was given, and those cells are null here with a suppressed flag.
- q: How often does it change?
  a: The publisher refreshes it through the day. This site reads it once a day, so each version is the
    figures at the time of that read.
summary: The number of people waiting and the median wait at each Queensland public emergency department
  at the time of each daily read, from Queensland Health's live data.
description: The current metrics behind Queensland Health's emergency department wait time pages, one
  row per facility, with the number waiting, the median wait for all triage categories and for categories
  4 and 5, a data status and the delay the publisher gives for the figures. Join to the facilities table
  on facility_code for names and locations.
