faq:
- q: What is in each row?
  a: The number of offences of one type flagged as family and domestic abuse-related that were reported to
    police in one quarter of the financial year, in one postcode, with the offence named at three levels.
- q: Can I add these to the crime statistics by suburb?
  a: No. These offences are a subset of the offences in the crime statistics table, flagged as being of a family
    and domestic abuse nature, so the publisher warns that the two files for one year must not be added together.
- q: Which period does the table cover?
  a: The financial year of the newest file South Australia Police has released, 2025-26 at the first version,
    by quarter. Each new file becomes a version here, and the earlier years back to 2010-11 stay on the portal.
summary: Offences flagged as family and domestic abuse-related that were reported to South Australia Police in the
  newest financial year, counted by quarter, postcode and offence type. Updated quarterly.
description: The family and domestic abuse-related offences file from South Australia Police's crime statistics.
  Each row is one quarter, postcode and offence, with the number of offences of that type reported to police that
  were flagged as being of a family and domestic abuse nature. The publisher writes `NOT DISCLOSED` where it does not
  give the postcode, and that is kept as published.
