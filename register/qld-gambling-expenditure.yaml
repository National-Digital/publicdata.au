faq:
- q: What is in each row?
  a: One gambling stream in one month, with the player expenditure in dollars. Player expenditure is the amount
    players lost, which is what they bet less what they won. The streams are Casino, EGM (gaming machines in
    hotels and clubs), Keno, Lottery and Wagering.
- q: What is the `CNP` row?
  a: The file holds one row for November 2013 with the stream `CNP` and no amount. The publisher does not define
    it, and the row is kept as published.
summary: The amount players lost each month in Queensland on casinos, gaming machines, keno, lotteries and
  wagering, since July 2004.
description: One row per gambling stream per month from July 2004, with player expenditure in dollars. The
  streams are Casino, EGM, Keno, Lottery and Wagering. The EGM figure is the metered win on gaming machines
  in hotels and clubs, so it matches the state total table.
