collection_search_title: Translink origin-destination trip data (Queensland public transport)
collection_description: 'Translink publishes a monthly count of public transport trips between each pair of
  stops, by operator, route, direction, time of day and ticket type, from its ticketing systems. A separate
  stops table gives each stop''s name, type and coordinates, so a trip''s origin and destination can be placed
  on a map.


  The publisher adds one zip file per month from January 2022. Trips before 2022 are in a separate dataset
  on the same portal.

  '
search_title: Translink origin-destination trips by stop, route and ticket type
