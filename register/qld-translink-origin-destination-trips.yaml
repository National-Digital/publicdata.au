faq:
- q: What is in each row?
  a: Each row is the number of trips in one month on one operator's route and direction, in one time band and
    on one ticket type, that began at one stop and ended at another. The stop numbers match the stop_id column
    of the origin-destination stops table.
- q: Why do some trips have no origin or destination stop?
  a: About one row in ten has a blank stop, and some stops have codes starting `DH`. The publisher records what
    its ticketing system logged, and its readme on the portal page explains these cases. They are kept as published.
- q: Which month does this cover?
  a: The publisher adds one file per month. This entry holds July 2026, the newest month at review. Earlier
    months from January 2022 are on the same portal page.
summary: The number of Translink public transport trips between each pair of stops in a month, by operator,
  route, direction, time of day and ticket type.
description: 'One row per combination of operator, month, route, direction, time band, ticket type, origin
  stop and destination stop, with the number of trips, from Translink''s ticketing data. Ticket types include
  go card, contactless payment (emv) and paper tickets. Stop numbers join to the origin-destination stops table
  in this collection.


  The publisher adds a new zip file each month. This entry reads the July 2026 file, the newest at review.

  '
