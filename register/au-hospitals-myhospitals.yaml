faq:
- q: What is in each row?
  a: One reporting unit of MyHospitals, which is a hospital, a Local Hospital Network, a Primary Health
    Network, a state or the nation. A hospital row has its coordinates, its sector, whether it is open or
    closed, its state, and the Local Hospital Network and Primary Health Network area the Institute maps it
    to. Most Local Hospital Network rows carry a point too. State, national and Primary Health Network rows
    have no coordinates.
- q: Is every hospital here?
  a: The list holds the hospitals the Institute reports on in MyHospitals, public and private, including
    some that have closed. A small private facility that reports nothing to the Institute may be missing.
- q: How does this join to the measures?
  a: The measure tables in this collection name each reporting unit by the same name, and the code here is
    the Institute's own identifier for it. The Institute has not endorsed this site.
summary: Every hospital and health network the AIHW reports on in MyHospitals, about 1,400 rows, with each
  hospital's coordinates, sector, status, state and health networks.
description: The MyHospitals mapping details extract from the AIHW MyHospitals Data API. Each row is one
  reporting unit, with its code, name, type, latitude and longitude, public or private sector, open or
  closed status, state, Local Hospital Network and Primary Health Network area.
