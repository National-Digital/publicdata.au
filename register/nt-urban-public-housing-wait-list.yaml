faq:
- q: What is in each row?
  a: One cell of the publisher's summary tables. Each release has three tables, the estimated wait time,
    the applicants on the wait list and the homes allocated, each by urban region and number of bedrooms.
    The value is a band of years for a wait time and a count for the wait list and allocations.
- q: Which licence applies?
  a: The portal states Creative Commons Attribution without a version. The Northern Territory Department
    of Corporate and Digital Development confirmed in writing on 2 October 2026 that, under the Northern
    Territory Government's Creative Commons Policy, this series is released under CC BY 4.0.
- q: What period does an allocations count cover?
  a: The twelve months to the release date. A December release counts the calendar year and a June release
    the financial year, so the two overlap by six months.
- q: What do the asterisks and the Total rows mean?
  a: An asterisk on a wait time marks one the publisher calculated by hand because a region has few homes
    and little turnover. The Total region and Total column are the publisher's own totals and are kept as
    published, so a sum over every row counts each applicant or allocation twice.
- q: Why does the series stop in 2020?
  a: The publisher released the summary twice a year from December 2018 to December 2020 and has released
    none on the portal since.
summary: The estimated wait for urban public housing in six Northern Territory regions, with the number
  of applicants waiting and homes allocated, by bedrooms, in five releases from December 2018 to December
  2020. Closed series.
description: Summary figures for urban public housing in Darwin and Casuarina, Palmerston, Alice Springs,
  Katherine, Nhulunbuy and Tennant Creek, released twice a year from 31 December 2018 to 31 December 2020.
  Each release gives the estimated wait time by bedrooms, the applicants on the wait list and the homes
  allocated in the preceding twelve months. The publisher's three tables in each file are read as one
  table, one row per cell.
