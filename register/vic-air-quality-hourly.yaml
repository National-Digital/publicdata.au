faq:
- q: What does each row hold?
  a: One hourly average of one measure at one EPA monitoring station, with the hour in AEST, local time
    and UTC, the station and its coordinates, the value and its unit, a validation flag and the method used.
    The measures include particles (PM2.5 and PM10), ozone, nitrogen oxides, sulfur dioxide, carbon monoxide,
    visibility and weather readings such as temperature and wind.
- q: Which year does it cover?
  a: EPA releases one workbook per calendar year once the year's data is validated, and this entry follows
    the newest. The first version holds 2025 and the first hours of 1 January 2026. Earlier years are on the publisher's portal as separate
    workbooks, back to 1979, and each later year is kept here as a new version.
- q: Why are some values negative?
  a: Gas analysers can read slightly below zero at very low concentrations. EPA publishes these validated
    values as measured, and they are kept as published.
summary: Every validated hourly air quality and weather reading from EPA Victoria's monitoring stations for
  the latest full year, about 880,000 rows, one row per station, measure and hour.
description: EPA Victoria's AirWatch hourly averages for all monitoring stations, read from the AllData
  sheet of the yearly workbook. Each row is one station, parameter and hour, with the value, its unit, the
  validation flag and the analysis method. The workbook's per-station sheets repeat the same values in wide
  form and are not read. The entry follows the newest yearly workbook, so each new year arrives as a new
  version.
