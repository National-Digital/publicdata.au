faq:
- q: What is in each row?
  a: Each row is one animal caught by the Shark Control Program, with the year and month, area, beach, gear,
    marine park, species, whether it was alive or deceased, its fate, its length in metres and its sex.
- q: What do the sex codes mean?
  a: F is female, M is male and U is unknown. The publisher writes `NULL` where no sex was recorded, which is
    null here.
summary: The length and sex of each shark and other animal caught by Queensland's shark nets and drumlines
  since 1996.
description: 'One row per animal caught by the Queensland Shark Control Program''s nets and drumlines from
  1996, from the biological information the Department of Primary Industries publishes. Each row gives the
  year and month, area, beach, gear, marine park, species group, CAAB code, common and scientific names, whether
  the animal was alive or deceased, its fate and the reason, its length in metres and its sex.


  The cells the publisher writes as `NULL` are null here.

  '
