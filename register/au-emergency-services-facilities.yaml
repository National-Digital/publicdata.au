faq:
- q: What is in each row?
  a: One police, ambulance, metropolitan fire, rural or country fire, SES or other emergency management
    facility, with its name, class, status, address, suburb, state and postcode, the state or territory
    agency the record came from, its coordinates, and the G-NAF address Geoscience Australia matched it to
    with that match's confidence and distance in metres.
- q: Where do the records come from?
  a: Geoscience Australia gathered them from each state and territory's emergency management agencies and
    open data portals, with the Australian Federal Police, through the Emergency Management Spatial
    Information Network Australia. The source columns name the agency for each row.
- q: Why does the attribution mention G-NAF?
  a: Geoscience Australia matched each facility to an address in the Geocoded National Address File, and
    its licence statement asks that products using it carry the G-NAF acknowledgement. Every file here
    carries it. Rows with the comment `NO GNAF POINT` have no matched address.
summary: About 8,900 police, fire, ambulance, SES and other emergency management facilities across
  Australia, one row per facility with its class, address and coordinates, from Geoscience Australia.
description: The Emergency Management Facilities Database from Geoscience Australia, read from its CSV
  download. Each row is one facility with its class, name, operational status, address, suburb, state,
  postcode and source agency, its published latitude and longitude, and the matched G-NAF address, its
  identifier, confidence and coordinates.
