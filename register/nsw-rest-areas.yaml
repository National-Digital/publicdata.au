faq:
- q: What is in each row?
  a: One rest area in New South Wales, with its rest area number, name, road, suburb, local government area
    and region, its category and the vehicles it takes, its status, its latitude and longitude, the number of
    toilets and the facilities the publisher records there.
- q: Who manages these rest areas?
  a: The list covers rest areas managed by Transport for NSW and by other authorities, including local
    councils and the National Parks and Wildlife Service. The responsible authority column names the manager
    of each site. Inspection bays that Transport for NSW manages are not included.
- q: Why are some facility columns blank?
  a: The publisher writes `TRUE` where a site has a facility and leaves the cell blank otherwise. It never writes
    false, so a blank here is null and means the file does not say.
summary: The rest areas on New South Wales roads, with each site's category, vehicle access, status, location
  and facilities, from Transport for NSW.
description: The NSW Rest Areas dataset from Transport for NSW, read from its CSV download on the Transport Open
  Data Hub. Each row is one rest area managed by Transport for NSW or another authority, with its number, name,
  road, place, category, vehicle type, status, coordinates, toilet count and facility flags. The publisher has
  left several facility and parking columns empty until it validates them. They are published as they stand, so
  values the publisher adds later appear here.
