faq:
- q: What does each row hold?
  a: One date and what falls on it, with its kind, its name, the body the date comes from and a link to
    that body's page. The kinds are public holidays, school terms and school holidays, daylight saving,
    Parliament of Victoria sitting days and the Faith Communities Council of Victoria's multifaith
    calendar.
- q: Why does one event appear on several rows?
  a: An event that lasts more than a day, such as Lent or a school holiday, has a row for each day the
    publisher lists, and those rows share one identifier. The file also repeats some rows exactly, and
    they are kept as published.
- q: How far ahead does it go?
  a: The file runs from October 2018 to December 2030, but each kind is only as complete as its source.
    Public holidays are listed for the years Business Victoria has declared them, and a school term row
    may note the years its source publishes. The school holiday rows name no source body, and the
    publisher describes them as the days between the terms.
summary: Public holidays, school terms and holidays, daylight saving changes, parliamentary sitting days
  and multifaith calendar dates for Victoria, one row per date, from 2018 to 2030.
description: The data behind the Victorian Government Important Dates API, published monthly by the
  Department of Government Services. Each row is one date with its kind, name, description and the
  publisher and web page it comes from. The sources are Business Victoria, the Department of Education,
  the Parliament of Victoria and the Faith Communities Council of Victoria.
