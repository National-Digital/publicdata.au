faq:
- q: What is in each row?
  a: One public hospital, Local Hospital Network, state or the nation, one financial year from 2011-12 and
    one triage category. It gives the number of presentations to the emergency department.
- q: What do the blanks mean?
  a: The Institute writes `<5` for a count under five. Those cells are null here with a suppressed flag, and
    the markers column keeps the code.
summary: The number of emergency department presentations in each triage category, for each public hospital,
  network and state each year since 2011-12, from AIHW MyHospitals.
description: The Presentations sheet of the MyHospitals emergency department data extract from the AIHW
  MyHospitals Data API. Each row is one reporting unit, financial year and triage category, with the number
  of presentations.
