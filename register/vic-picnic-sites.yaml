faq:
- q: What is in each row?
  a: One feature that Vicmap types as feature type recreational resource with subtype picnic site. Each row has
    the feature's name where Vicmap gives one, the name of its parent feature where Vicmap records one, the
    authority Vicmap records for it, its Vicmap and VICNAMES identifiers, the date Vicmap created the feature,
    and its longitude and latitude in GDA2020.
- q: Why do some rows have no name?
  a: Vicmap gives no name for about 360 of the picnic sites. Those rows have a blank name, as Vicmap serves
    them. About 80 of them carry the name of the park or reserve they sit within in the parent feature
    name column.
- q: Why do some rows have no coordinates?
  a: Vicmap serves each feature as a set of points. Most sites are one point, and their coordinates are
    published as given. A few sites are served as two points, and those rows have blank coordinates because
    this site does not choose one point over another.
- q: Why are some sites in New South Wales or South Australia?
  a: Vicmap maps features near the border on both sides, and its state field marks those outside Victoria as
    NSW or SA. The rows are kept as served.
- q: Does it say what facilities a site has?
  a: No. Vicmap records where a named feature is. It does not record tables, barbecues, toilets, shelters or
    opening times. The authority that manages each site sets those.
summary: About 840 picnic sites that Vicmap Features of Interest maps as points in and near Victoria, one row
  per site, with its name, parent feature, Vicmap identifiers and coordinates.
description: The picnic sites in the Vicmap Features of Interest point layer, foi_point, read from the Vicmap
  web feature service with the filter feature type recreational resource and subtype picnic site. Each row
  carries the site's name, its parent feature's name, the authority Vicmap records for it, its Vicmap and
  VICNAMES identifiers, the date Vicmap created the feature, and its longitude and latitude in GDA2020.
