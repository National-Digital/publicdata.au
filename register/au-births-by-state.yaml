faq:
- q: What is in each row?
  a: One measure for one state or territory of usual residence, or Australia, in one year of registration
    since 1975. The measures are the number of births, male and female births, nuptial and ex-nuptial
    births, the estimated population, the crude birth rate per 1,000 people and the sex ratio of male
    births per 100 female births.
- q: Can I add the measures together?
  a: Each row is a different quantity, and the measure column says what it is. Sum only the
    rows of one count measure, such as Births across the states, and never add a rate or the sex ratio.
- q: Is the year the year of birth?
  a: It is the year the birth was registered. The state is the mother's state or territory of usual
    residence.
summary: Births registered each year since 1975 in each state and territory, with male and female births,
