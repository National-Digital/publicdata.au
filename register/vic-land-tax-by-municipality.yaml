faq:
- q: What does each row hold?
  a: One of Victoria's 79 municipalities in the 2024 land tax year, with the number of properties
    assessed for land tax, their total unimproved value, the land tax apportioned to them and that tax
    as a percentage of the state's land tax. The last row is the publisher's total for Victoria.
- q: What is proportionate tax?
  a: Land tax is assessed on an owner's total holdings, so an owner with land in several municipalities
    pays one amount. The State Revenue Office apportions that amount across the municipalities in
    proportion to the land's value, and the column holds the apportioned sum in dollars.
- q: Where are other years?
  a: The State Revenue Office publishes each year as its own dataset, and this entry holds the 2024
    file. Earlier years have their own records on the Victorian portal.
summary: For each Victorian municipality in 2024, the number of properties assessed for land tax, their
