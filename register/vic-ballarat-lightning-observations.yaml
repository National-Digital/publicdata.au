faq:
- q: What does each row hold?
  a: One reading from a City of Ballarat lightning sensor, with its time in UTC, the sensor's location, the
    number of strikes it registered in the measurement period and their average distance. Most readings
    record no strikes.
- q: How does the sensor work?
  a: The council's description says the sensor listens for the disturbance a strike makes in an amplitude modulation (AM) radio
    signal, and reports the count of strikes and their average distance in each period, as set out in the
    ATMOS41 manual. The council says it is not an official source of weather information.
- q: What are the rows with location none?
  a: About 1,400 readings name no location and give 0 for latitude and longitude. They are kept as
    published. They run from 27 March to 7 April 2025. The rest come from the sensor at the rowing course
    and stop on 2 April 2024, so the table holds no readings from 2 April 2024 to 27 March 2025.
- q: Is it still updated?
  a: The council's portal says the dataset is typically updated every 15 minutes, but the last reading is
    from 7 April 2025 and the portal has not changed since.
summary: About 29,000 readings from a City of Ballarat lightning sensor between March 2023 and April 2025,
  each with the count of strikes registered and their average distance.
description: Lightning observations published by the City of Ballarat on its open data portal, one row
  per sensor reading from 20 March 2023 to 7 April 2025, with the time, location description, latitude,
  longitude, number of strikes and average distance to them. Nearly all readings come from one sensor at
  the rowing course on Lake Wendouree, and those stop on 2 April 2024. The readings from 27 March 2025 name
  no location.
