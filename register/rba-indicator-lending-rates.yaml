faq:
- q: What is an indicator lending rate?
  a: 'The advertised, or indicator, rate at the end of each month for a standard product from a sample
    of lenders: standard and discounted variable and three year fixed housing loans for owner-occupiers
    and investors, credit cards, unsecured personal loans, margin and home equity loans, and small and
    large business loans. The RBA describes them as indicative and likely to be revised. The series began
    at different dates, so early rows have many null cells.'
- q: Which series come from other sources?
  a: The weighted average rates on small and large business credit outstanding are compiled by APRA, and
    the average outstanding rates on securitised housing loans come from the RBA Securitisation System.
    Each field description names its source as the RBA states it.
- q: Under what licence is RBA data republished here?
  a: The RBA excludes its numerical data from the CC BY 4.0 licence that covers the rest of its site,
    and instead permits it to be used, reproduced, published and communicated to the public for personal
    or commercial use under sections 4 and 5 of its copyright notice, with attribution and no claim of
    endorsement. The RBA does not endorse this site or any use of this data, and it publishes the same
    figures free of charge at rba.gov.au. Every file here carries that attribution.
summary: Advertised housing, personal and business lending rates at the end of each month since January
  1959, including the standard variable home loan rate, credit card rates and small business rates. Updated
  monthly.
description: Statistical table F5, Indicator Lending Rates, from the Reserve Bank of Australia. One row
  per month end from 31 January 1959 with the rate, per cent per annum, on standard, discounted, interest-only
  and three year fixed housing loans from banks for owner-occupiers and investors, on mortgage manager
  housing loans, on standard and low rate credit cards, on fixed and variable unsecured personal loans,
  home equity and margin loans, on small business term, overdraft and fixed loans, on large business credit
  outstanding, and the average outstanding variable rate on securitised housing loans.
