faq:
- q: What is in each row?
  a: One rest area that the State maintains in South Australia, with the department's asset number, the rest
    area type, surface, size in square metres, condition and status, whether truck parking is allowed, and
    counts of toilet blocks, water tanks, shelters, tables and bins. The shape of each site is its mapped
    footprint.
- q: Why are the sites shapes and not points?
  a: The department maps each rest area as the area it covers beside the road. The shapes are published as
    given, moved to GDA2020 where needed, and no centre point is worked out.
- q: Does it include council rest areas?
  a: No. The layer holds the rest areas the State maintains. The publisher says councils should be asked about
    the rest areas each one maintains.
summary: The rest areas the State maintains on South Australian roads, each as its mapped footprint, with its
  type, surface, condition and facility counts, from the Department for Infrastructure and Transport.
description: The Rest Areas - State Maintained layer of the Department for Infrastructure and Transport, read
  from the GeoJSON in its download. Each row is one rest area with the department's asset number, type, surface,
  size, condition, status, truck parking flag and counts of toilet blocks, water tanks, shelters, tables and
  bins. The publisher's metadata says field staff captured the sites in 2017 and that most are placed within
  100 metres.
