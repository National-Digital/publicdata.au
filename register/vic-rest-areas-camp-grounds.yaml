faq:
- q: What is in each row?
  a: One feature that Vicmap types as feature type community space with subtype rest area or camp ground. Each
    row has the feature's name where Vicmap gives one, its subtype, the name of its parent feature where Vicmap
    records one, the authority Vicmap records for it, its Vicmap and VICNAMES identifiers, the date Vicmap
    created the feature, and its longitude and latitude in GDA2020.
- q: How do I find only the camp grounds?
  a: The feature subtype column holds camp ground for the 1,700 or so camp grounds and rest area for the 560 or
    so rest areas. Filter on that column.
- q: Why do some rows have no name?
  a: Vicmap gives no name for about 330 of the rest areas and about 50 of the camp grounds. Those rows have a
    blank name, as Vicmap serves them.
- q: Why do some rows have no coordinates?
  a: Vicmap serves each feature as a set of points. Most sites are one point, and their coordinates are
    published as given. About 20 sites are served as two points, and those rows have blank coordinates
    because this site does not choose one point over another.
- q: Why are some sites in New South Wales or South Australia?
  a: Vicmap maps features near the border on both sides, and its state field marks those outside Victoria as
    NSW or SA. The rows are kept as served.
- q: Does it say what facilities a site has or whether I can stay overnight?
  a: No. Vicmap records where a named feature is. It does not record toilets, water, fees or how long a person
    may stay. The authority that manages each site sets those rules.
summary: About 560 rest areas and 1,700 camp grounds that Vicmap Features of Interest maps as points in and near
  Victoria, one row per site, with its name, subtype, Vicmap identifiers and coordinates.
description: The rest areas and camp grounds in the Vicmap Features of Interest point layer, foi_point, read
  from the Vicmap web feature service with the filter feature type community space and subtype rest area or
  camp ground. Each row carries the site's name, its subtype, its parent feature's name, the authority Vicmap
  records for it, its Vicmap and VICNAMES identifiers, the date Vicmap created the feature, and its longitude
  and latitude in GDA2020.
