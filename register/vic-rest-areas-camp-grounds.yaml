omit:
  ufi: Vicmap's identifier for the current version of the feature's record, which Vicmap reissues when it
    reloads the record.
  feature_ufi: A copy of ufi in every row but one.
  create_date_ufi: The date Vicmap issued the current version of the record. Vicmap issued 1,546 of the 2,261
    records in October 2026, and keeping the date would make a new version for a reload that changes nothing
    about the site.
  feature_create_date_ufi: A copy of create_date_ufi in every row but one.
  auth_org_verified: The date Vicmap last checked the responsible authority, which moves with a record review
    that changes nothing about the site.
