faq:
- q: What is in each row?
  a: One automatic weather station in the network the Department of Primary Industries and Regional
    Development reports on its weather website, with its station code, the organisation that owns it,
    its name, longitude, latitude and altitude, the date it started, the kinds of observation it
    collects, and a link to its page.
- q: Are the weather readings included?
  a: No. Each row describes a station. The readings are on the department's weather website and
    through its weather API, which this site does not copy.
- q: Are all the stations DPIRD's?
  a: No. The network includes stations owned by other agencies and companies, named in the owner
    column. For five stations the owner column holds the publisher's caution not to use their
    observations, and those rows are kept as published.
- q: Where is the publisher's file?
  a: The portal's file downloads need a sign-in, so this site reads every feature of the publisher's
    public map service layer in pages, in WGS84, and keeps them as one GeoJSON file, which is the source
    file beside every version.
summary: The 246 automatic weather stations in the network the Department of Primary Industries and
  Regional Development reports on, one row per station, with owner, coordinates, altitude, start date
  and the observations it collects.
description: The stations of the automatic weather station network reported on the Department of
  Primary Industries and Regional Development's weather website, most of them DPIRD's own, read from
  the DPIRD-075 layer of the Western Australian Government's public map service. Each row carries the
  station code, owner, station name, longitude and latitude, altitude in metres, the date the station
  started, the list of observation types it collects and a link to its page on the weather website.
