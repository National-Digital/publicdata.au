faq:
- q: What is in each row?
  a: Each row is one local government area in Queensland, with its name, its abbreviated name, its code,
    its area in square kilometres and its boundary as a polygon.
- q: How do these differ from the ABS local government areas?
  a: These are the Queensland Government's own boundaries, kept up to date as council areas change. The
    ABS layer is a statistical approximation of them, built from Mesh Blocks for one edition of the
    Australian Statistical Geography Standard.
summary: The boundary, name and code of every local government area in Queensland, from the Queensland
  Government's administrative boundaries.
description: The spatial representation of the local government areas of Queensland. Each feature carries
  the area's name, its abbreviated name, its local government area code and its area in square kilometres.
  The layer is read from the Queensland Government's administrative boundaries map service.
