faq:
- q: What is in each row?
  a: Each row is one library branch or mobile library in the financial year the file covers. It gives the council
    and its service type, the year the branch opened, its opening hours per week, mobile operating hours and
    stops, total and public floor space in square metres, the internet connection and whether public Wi-Fi
    and bookable spaces are offered.
- q: What do `IND`, `RLQ` and `IKC` mean?
  a: They are the publisher's service types. `IND` is an independent council library service, `RLQ` is a council
    in the Rural Libraries Queensland partnership with the State Library, and `IKC` is an Indigenous Knowledge
    Centre.
- q: Which year does this cover?
  a: The publisher adds one file per financial year. This entry follows the newest branch file, which is 2024/2025
    at the time of review, and each new year becomes a new version.
summary: Opening hours, floor space and services of each Queensland public library branch for the latest financial
  year.
description: 'One row per public library branch or mobile library in Queensland for one financial year, from
  the annual statistics the State Library of Queensland collects from councils. Each row gives the council,
  the service type, the branch name and year of opening, opening hours per week, mobile library hours and stops
  per week, total and public access floor space, the internet connection type, and whether public Wi-Fi and
  bookable spaces are offered.


  The publisher adds a new file for each financial year. This entry follows the newest. A dash, kept as a null
  value, means the measure does not apply, such as mobile stops for a fixed branch.

  '
