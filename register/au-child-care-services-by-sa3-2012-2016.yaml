faq:
- q: What is in each row?
  a: One ABS Statistical Area Level 3 (2011) in Greater Sydney or Greater Melbourne, one financial year from
    2012-13 to 2015-16, one service type and one age group of children. It gives the number of children
    using Child Care Benefit approved services of that type, the number of services, and the mean and
    standard deviation of their fees per hour.
- q: What are the service types?
  a: In the publisher's codes, `LDC` is long day care, for children who have not yet started school. `BSC` and `ASC` are before and after
    school hours care, mostly for school children.
- q: What do the blanks mean?
  a: The department rounds child counts to the nearest 10 and shows counts under 5 as <10, and service
    counts under 5 as <5. Those cells are null here with a suppressed flag. Fees are rounded to the nearest
    5 cents and are kept as the department wrote them, with the dollar sign.
summary: Children, services and the mean hourly fee of Child Care Benefit approved long day care and
  outside school hours care in each area of Greater Sydney and Greater Melbourne, 2012-13 to 2015-16.
description: The Department of Education's Child Care Administrative Data, for Child Care Benefit approved
  long day care, before school hours care and after school hours care services in Greater Sydney and
  Greater Melbourne. Each row is one SA3 area, financial year, service type and age group of children, with
  the number of children, the number of services and the mean and standard deviation of hourly fees. The
  department no longer updates the file.
