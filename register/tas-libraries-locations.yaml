faq:
- q: What is in each row?
  a: One Libraries Tasmania location, with its name, street address, phone number, email address, whether it has wheelchair access, the path of its page
    on the Libraries Tasmania site, and its longitude and latitude.
- q: Does it give opening hours?
  a: No. Each location's opening hours are on its page on the Libraries Tasmania site.
- q: How current is it?
  a: The file on data.gov.au was last replaced in April 2020. Locations that opened, moved or closed since
    then are not reflected. This site checks the record for a new file and adds a dated version when it
    changes.
summary: The locations of Libraries Tasmania's public libraries, one row per location, with address, phone
  number, email address and coordinates.
description: Libraries Tasmania's own list of its locations, published as GeoJSON on data.gov.au. Each row
  carries the location's name, street address, phone number, email address, wheelchair access, the path of its page on the Libraries
  Tasmania site, and the point's longitude and latitude.
