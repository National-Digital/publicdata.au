faq:
- q: What is in each row?
  a: The number of offences of one type reported to police on one day in one suburb and postcode, with the
    offence named at three levels, from the broad group (offences against the person or against property) to
    the specific offence.
- q: Which period does the table cover?
  a: The financial year of the newest file South Australia Police has released, 2025-26 at the first version.
    SAPOL replaces the year's file as each quarter is added and starts a new file each July, and each file
    becomes a version here. The earlier years back to 2010-11 stay on the portal.
- q: What does `NOT DISCLOSED` mean in the postcode column?
  a: The publisher writes `NOT DISCLOSED` where it does not give the postcode of an incident, and leaves some
    suburbs and postcodes blank. Both are kept as published.
- q: Can I add these to the family and domestic abuse figures?
  a: No. The family and domestic abuse-related offences are a subset of these offences, so the publisher warns
    that the two files for one year must not be added together.
summary: Every offence against the person or against property reported to South Australia Police in the newest
  financial year, counted by day, suburb, postcode and offence type. Updated quarterly.
description: 'Suburb-based crime statistics from South Australia Police. Each row is one day, suburb, postcode and
  offence, with the number of offences of that type reported to police. Offences are named at three levels: the
  group (offences against the person or against property), the division, such as assault or theft, and the
  specific offence.


  The publisher notes that the data is point in time.'
