collection_description: Offences against the person and against property reported to South Australia Police, from
  the files SAPOL publishes for each financial year. One table counts every such offence by suburb, postcode and
  day. The other counts the subset flagged as family and domestic abuse by postcode and quarter, and the two
  must not be added together.
