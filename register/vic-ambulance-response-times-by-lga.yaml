faq:
- q: What does each row hold?
  a: One council area and dispatch code, Code 1 or Code 2, for the 2018-19 financial year, with the share
    of incidents reached within 15 minutes, the average response time in seconds and the number of incidents.
    The publisher reports the 15 minute share for Code 1 only, so it is blank on Code 2 rows.
- q: Why are there rows that are not council areas?
  a: The publisher adds rows for Unincorporated Vic, Interstate LGAs and its `Total AV`, and ends both the
    Code 1 and the Code 2 table with a note on Moonee Valley, where inter hospital transfers arriving by air lengthen Code 2 times.
    These rows are kept as published.
- q: Why is there a row that repeats the column names?
  a: The publisher's file holds the Code 1 table and then the Code 2 table, and repeats the header row
    between them. That row is kept as published, with its number columns null.
- q: Why is the share within 15 minutes text?
  a: The publisher writes it with a percent sign, such as 51.1%, and it is kept as written.
summary: The share of Code 1 ambulance incidents reached within 15 minutes, the average response time and
  the number of incidents in each Victorian council area in 2018-19, from Ambulance Victoria.
description: Ambulance Victoria's response time performance by Local Government Area for 2018-19. Each
