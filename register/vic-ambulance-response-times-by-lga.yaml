collection_description: |
  Ambulance Victoria publishes its response time performance for each financial year, for Code 1 (lights and sirens) and Code 2 (urgent) incidents. A response time runs from the receipt of the triple zero call until paramedics arrive on scene.

  Two tables are here. One gives each council area (LGA) and the other each urban centre and locality (UCL) of more than 7,500 people. Each gives the share of Code 1 incidents reached within 15 minutes, the average response time in seconds and the number of incidents.
