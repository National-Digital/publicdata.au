faq:
- q: What is in each row?
  a: One reported measure of the MyHospitals Data API. A reported measure is one measure, such as the median
    waiting time for elective surgery (MYH0007), given for one category, such as an intended procedure or
    an urgency category. Each row has the reported measure's code and name, the measure's code, name and
    units, and the category's code, name and type.
- q: How does this join to the waiting-time tables?
  a: The waiting-time tables in this collection name each intended procedure by the category name here.
    The category code stays the same when the Institute changes a name, so a reuser can hold the code and
    look up the name. The Institute has not endorsed this site.
summary: The codes behind the names in AIHW MyHospitals, about 700 rows, one for each measure the Institute
  reports for each category such as an intended procedure.
description: The reported measures list of the AIHW MyHospitals Data API. Each row is one reported measure
