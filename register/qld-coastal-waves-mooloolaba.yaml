faq:
- q: What is in each row?
  a: Each row is one half-hour reading from the Mooloolaba wave monitoring buoy, in Australian Eastern Standard
    Time. It gives the significant and maximum wave height, the zero upcrossing and peak periods, the direction
    the peak waves come from and the sea surface temperature.
- q: Why are some readings blank?
  a: The publisher writes -99.9 where the buoy gave no valid value for a reading. Those cells are kept as null
    values here.
- q: Why does this hold only one year?
  a: The publisher adds a new CSV file for each year. This entry follows the newest file, so a version holds
    the year that file covers. The newest file can stop part way through its year.
summary: Half-hourly wave height, period and direction and sea surface temperature from the Mooloolaba wave
  buoy, for the newest year the publisher has released.
description: 'Measured and derived wave readings from the wave monitoring buoy the publisher anchors off Mooloolaba,
  one row per half-hour record. Significant wave height (Hs) is the average of the highest third of the waves
  in a 26.6 minute record. Hmax is the highest wave in the record. Tz is the zero upcrossing period and Tp
  the peak energy period. Peak direction is measured from true north and gives the direction the peak waves
  come from. Sea surface temperature is read by a sensor in the hull of the buoy.


  The publisher adds one CSV file for each year, and this entry follows the newest of them.'
