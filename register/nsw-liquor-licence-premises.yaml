faq:
- q: What is in each row?
  a: One liquor licence and its premises, with the licence number, type, status and start date, the
    venue's name, address, council area and coordinates, the licensee type and ABN or ACN, the trading
    hours it is authorised for, and for venues that keep gaming machines the number of entitlements and
    of machines operating.
- q: Why are licensee names not here?
  a: The publisher's list names each licensee, many of whom are private people. That column is held back,
    and the licensee type, ABN and ACN are published.
- q: How current is it?
  a: Liquor and Gaming NSW added a list to the portal each month until June 2024. This entry follows the
    newest list there, so the latest version is the list as at 7 June 2024.
summary: Every liquor licence in New South Wales in June 2024 with the venue's address and coordinates, licence type,
  trading hours and gaming machine numbers, from Liquor and Gaming NSW's monthly premises list.
description: The Liquor licence premises list from Liquor and Gaming NSW, one row per licence, from the
  newest monthly list on the NSW Government open data portal. Each row has the licence number, type, start
  date and status, the licence name and venue address, latitude and longitude, council area, precinct
  and region, the licensee type, ABN and ACN, the business type, the trading authorisations, the SA2 area
  and band, and the gaming machine entitlements, permits, threshold and operating machines.
