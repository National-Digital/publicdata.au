faq:
- q: What is in each row?
  a: One ABS suburb or locality of 2021, the postal area it falls in, and one Modified Monash Model 2023
    category found within it, with the area of the suburb in that category. A suburb that spans two
    categories has a row for each.
- q: What do the MMM categories mean?
  a: The Modified Monash Model (MM) ranks places from MM 1, metropolitan areas, to MM 7, very remote
    communities, by remoteness and town size. The department uses it for health workforce programs and
    rural incentives. A practice's own classification is set by its street address in the department's
    locator, so a suburb split across categories needs that check.
- q: Why do some postcodes have three digits?
  a: The department's workbook stores postcodes as numbers, so Northern Territory postcodes such as 0800
    appear as 800. They are kept as published.
summary: The Modified Monash Model 2023 remoteness category of every Australian suburb and locality, with
  its postal area and the area in each category, from the Department of Health, Disability and Ageing.
description: The department's lookup of ABS Suburbs and Localities (SAL) 2021 and Postal Areas (POA) 2021
  against the Modified Monash Model 2023. Each row is one suburb, its postal area and one MMM category within
  it, with the suburb's area, the area of the suburb in that category and the state.
