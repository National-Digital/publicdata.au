faq:
- q: What is in each row?
  a: One price a Queensland service station reported for one fuel, with the station's id, name, brand,
    address, suburb, postcode and coordinates, the fuel type, the price in tenths of a cent per litre,
    and the time the price was reported in UTC. A station reports a new row each time it changes a price.
- q: How do I read the price?
  a: The price is in tenths of a cent, so 1699 is 169.9 cents a litre. The publisher writes 9999 when
    a fuel is temporarily unavailable, such as an empty tank, and those cells are null here.
- q: Which month does it cover?
  a: The newest month Queensland Treasury has published, August 2026 in the first version here. Treasury
    adds a file for each month, and this table follows the newest one, so each version is one month.
summary: Every fuel price change reported by Queensland service stations in the newest month Queensland
  Treasury has published, with station, brand, location, fuel type and time.
description: Fuel prices reported by Queensland service stations under the state's fuel price reporting
  scheme, one row per price change, for the newest month Queensland Treasury has published. Each row has
  the station id, name, brand, address, suburb, state, postcode, latitude and longitude, the fuel type,
  the price in tenths of a cent per litre and the reporting time in UTC. The scheme also has a live API,
  which needs a key and is not used here.
