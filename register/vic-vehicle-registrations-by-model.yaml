faq:
- q: What does each row hold?
  a: A count of vehicles on the Victorian register at the end of the quarter that share one make, model
    and body colour. Boats and trailers are not included.
- q: What do the codes mean?
  a: Make and model are the register's codes of up to six characters, such as `TOYOTA` and `RANGER`, and colour
    is a three letter code such as `WHI` or `BLK`. Some models are blank or read `UNK`, as the register holds
    them, and a few combinations appear on more than one row.
- q: Which quarter is it?
  a: Each version is the newest quarterly snapshot the department has released. The portal lists earlier
    quarters back to the second quarter of 2023 as separate files.
summary: The number of vehicles registered in Victoria at the end of the quarter for each make, model and
  body colour, from the VicRoads register.
description: The whole fleet vehicle registration snapshot by model from the Department of Transport and
  Planning. Each row is the count of registered vehicles that share a make, model and body colour at the
  end of a quarter. Boats and trailers are not included. The publisher notes that some words may be
  misspelt or attributes incorrect.
