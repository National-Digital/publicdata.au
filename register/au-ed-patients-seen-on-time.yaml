faq:
- q: What is in each row?
  a: One public hospital, Local Hospital Network, state or the nation, one financial year from 2011-12 and
    one triage category. It gives the number of emergency presentations and the share of patients whose
    care began within the recommended time for their triage category, beside the average for the
    hospital's peer group.
- q: What is on time?
  a: Care must begin within 2 minutes for resuscitation, 10 minutes for emergency, 30 minutes for urgent,
    60 minutes for semi-urgent and 120 minutes for non-urgent patients. The share is a fraction, so 0.8
    means 80 per cent.
- q: What do the blanks mean?
  a: The Institute writes `<5` for a count under five and `NP` where the data did not meet its criteria or more
    than 10 per cent of times were missing. Those cells are null here with a suppressed flag. A dash, meaning
    no patients were reported, and Not peered are null. The Institute's file also marks with an asterisk
    the figures to interpret with caution, in a column with no heading, which is not carried here.
summary: The share of emergency department patients seen within the recommended time for their triage
  category, for each public hospital, network and state each year since 2011-12, from AIHW MyHospitals.
