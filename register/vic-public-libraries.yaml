faq:
- q: What is in each row?
  a: One feature that Vicmap types as feature type cultural centre with subtype library, with its name, the name
    of its parent feature where Vicmap records one, the identifiers Vicmap and VICNAMES use for it, the dates
    Vicmap created its records, and its longitude and latitude in GDA2020.
- q: Why do some rows have no coordinates?
  a: Vicmap serves each feature as a set of points. Most libraries are one point, and their coordinates are
    published as given. A few libraries are served as two points, and those rows have blank coordinates
    because this site does not choose one point over another.
- q: Why are some libraries in New South Wales?
  a: Vicmap maps features near the border on both sides, and its state field marks those in New South Wales
    as NSW. The rows are kept as served.
- q: Does it give opening hours or who runs each library?
  a: No. Vicmap records where a named feature is. It does not record opening hours or the library service
    that runs each branch.
summary: About 320 libraries that Vicmap Features of Interest maps as points in and near Victoria, one row per
  library, with its name, Vicmap identifiers and coordinates.
description: The libraries in the Vicmap Features of Interest point layer, foi_point, read from the Vicmap web
  feature service with the filter feature type cultural centre and subtype library. Each row carries the
  library's name, its parent feature's name, the authority Vicmap records for it, its Vicmap and VICNAMES
  identifiers, the dates Vicmap created its records, and its longitude and latitude in GDA2020.
