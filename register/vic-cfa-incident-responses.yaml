faq:
- q: What does each row hold?
  a: One incident CFA brigades responded to, with the date and time it was reported, CFA's incident number,
    the CFA district number and the incident type as a code and as words. The workbook holds one sheet per
    financial year from 2009-10 to 2021-22, and the financial year is kept from the sheet name.
- q: Why do some rows have no district or incident type?
  a: The publisher leaves the district blank or writes `NULL` where none was recorded, and some incidents
    have no type recorded. Both are kept as null.
- q: What do the incident type codes mean?
  a: They are the codes of the Australasian Incident Reporting System. Each row also carries the type in
    words as CFA wrote it, so the codes can be read without a separate list.
summary: Every incident Country Fire Authority brigades responded to from July 2009 to June 2022, about
  530,000 rows, with the time, district and incident type.
description: CFA incident responses, one row per incident from 1 July 2009 to 30 June 2022, read from the
  workbook's sheet for each financial year. Each row has the date and time the incident was reported, CFA's
  incident number, the CFA district and the incident type code and description. The incidents cover fires,
  rescues, hazardous material calls, alarms and assistance to other agencies across the CFA area.
